<style>
  /* Phone first; tokens and sizes from web/SPEC.md "Accessibility (WCAG 2.1 AA)". */
  :root {
    --bg: #ffffff; --bg2: #f4f5f7; --text: #1b1b1f; --muted: #5b5e66; --accent: #1558b0; --on-accent: #ffffff;
    --danger: #b3261e; --mark: #8a5a00; --line: #d5d7dd; --unsaved-bg: #fff1c2;
    /* Grade colours: grade-tui's hues, each >= 4.5:1 on --bg and --bg2 (tests/style.test.js) */
    --grade-a: #0b5cad; --grade-bp: #00777a; --grade-b: #2d7a12; --grade-cp: #5a7000;
    --grade-c: #806600; --grade-dp: #9a5b00; --grade-d: #b34700; --grade-f: #b3261e;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121316; --bg2: #1c1d21; --text: #ececf0; --muted: #a9abb3; --accent: #8ab4f8; --on-accent: #0b1b33;
      --danger: #ff8a80; --mark: #f2c14e; --line: #3a3c42; --unsaved-bg: #3d3214;
      --grade-a: #7ab8ff; --grade-bp: #4fd1d1; --grade-b: #8fdc5a; --grade-cp: #c6e04a;
      --grade-c: #f2e14a; --grade-dp: #ffc24d; --grade-d: #ff9a4d; --grade-f: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-size: 1.0625rem; line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Sukhumvit Set", Thonburi, "Noto Sans Thai",
      "Leelawadee UI", Tahoma, sans-serif;
  }
  @media (min-width: 960px) { body { font-size: 0.9375rem; } }
  main { max-width: 60rem; margin: 0 auto; padding: 0 1rem 2rem; }
  h1 { font-size: 1.5rem; margin: 0; }
  p { margin: 0.25rem 0; }
  button, input, select { font: inherit; font-size: max(1rem, 16px); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 2px var(--bg); }
  h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus { outline: none; box-shadow: none; }
  .muted { color: var(--muted); }
  .warn { color: var(--mark); }
  .unsaved { color: var(--mark); font-weight: 600; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .id { font-variant-numeric: tabular-nums; }

  .page-head { padding: 1rem 0 0.75rem; }
  .btn {
    min-height: 2.75rem; min-width: 2.75rem; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent);
  }
  .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
  .notice { padding: 1rem 0; }
  .notice-title { font-weight: 600; }

  .courses { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
  .card {
    display: flex; flex-direction: column; gap: 0.125rem; width: 100%; min-height: 4.5rem;
    padding: 0.75rem 2.5rem 0.75rem 1rem;
    border: 1px solid var(--line); border-radius: 0.75rem; background: var(--bg); color: var(--text); text-align: left;
    position: relative;
  }
  .card.course { cursor: pointer; }
  .card-title { font-weight: 600; font-size: 1.125rem; }
  .card .chevron {
    position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); font-size: 1.5rem; color: var(--muted);
  }
  .card.unavailable { background: var(--bg2); padding-right: 1rem; }
  .tag { font-weight: 600; color: var(--danger); }
  .placeholder { background: var(--bg2); border-color: var(--bg2); margin-bottom: 0.5rem; }

  .opening { padding: 2rem 0; text-align: center; }
  .spinner {
    width: 2rem; height: 2rem; margin: 1rem auto; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

  .course-head {
    position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 0.5rem 0;
    border-bottom: 1px solid var(--line);
  }
  .course-bar { display: flex; align-items: center; gap: 0.25rem; min-width: 0; }
  .course-name {
    flex: 1; min-width: 0; font-size: 1.25rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .icon {
    min-width: 2.75rem; min-height: 2.75rem; border: 0; background: none; color: var(--accent); font-size: 1.75rem;
    cursor: pointer; border-radius: 0.5rem;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  [hidden] { display: none !important; }
  .btn.outline { background: var(--bg); color: var(--accent); }
  .badge { margin-left: auto; white-space: nowrap; padding-left: 0.5rem; }

  /* 4. Column mode */
  .col-picker { padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
  .col-picker label { font-weight: 600; }
  .col-row { display: flex; align-items: center; gap: 0.5rem; }
  .col-row .icon:disabled { color: var(--line); cursor: default; }
  .col-select {
    flex: 1; min-width: 0; min-height: 2.75rem; padding: 0.25rem 0.5rem; border: 1px solid var(--line);
    border-radius: 0.5rem; background: var(--bg); color: var(--text);
  }
  .col-line { margin: 0.25rem 0 0.5rem; }
  .search { position: relative; }
  .search-input {
    width: 100%; min-height: 2.75rem; padding: 0.25rem 3rem 0.25rem 0.75rem; border: 1px solid var(--line);
    border-radius: 0.5rem; background: var(--bg); color: var(--text);
  }
  .search-clear { position: absolute; right: 0; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search-row { display: flex; align-items: center; gap: 0.5rem; }
  .search-row .search { flex: 1; min-width: 0; }
  .fill-btn { flex-shrink: 0; white-space: nowrap; }
  .view-grading .col-picker, .view-grading .action-bar, .view-grading .empty { display: none; }
  .grading { max-width: 32rem; }
  .cfg { padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
  .cfg h2 { font-size: 1.125rem; margin: 1rem 0 0; }
  .cfg-preview summary { min-height: 2.75rem; padding-top: 0.5rem; cursor: pointer; }
  .cfg-preview p { margin: 0.5rem 0 0; }
  .cfg-key { display: flex; flex-direction: column; }
  .cfg-key .letter { font-weight: 700; }
  .range { color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
  .dist { list-style: none; margin: 0.5rem 0 0; padding: 0; }
  .dist li {
    display: grid; grid-template-columns: 2.5rem 1fr 7.5rem; align-items: center; column-gap: 0.75rem;
    padding: 0.25rem 0; font-variant-numeric: tabular-nums;
  }
  .dist .count { text-align: right; }
  .dist .letter { font-weight: 700; }
  .dist .bar { height: 0.875rem; border-radius: 0.25rem; background: var(--bg2); overflow: hidden; }
  .dist .bar span { display: block; height: 100%; background: currentColor; }
  .tag-preview { margin-left: 0.5rem; font-size: 0.875rem; font-weight: 400; color: var(--mark); }
  .g-a { color: var(--grade-a); } .g-bp { color: var(--grade-bp); } .g-b { color: var(--grade-b); }
  .g-cp { color: var(--grade-cp); } .g-c { color: var(--grade-c); } .g-dp { color: var(--grade-dp); }
  .g-d { color: var(--grade-d); } .g-f { color: var(--grade-f); }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row {
    display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 0.75rem;
    padding: 0.5rem 0; border-bottom: 1px solid var(--line);
  }
  .who { display: flex; flex-direction: column; min-width: 0; }
  button.who {
    position: relative; width: 100%; min-height: 2.75rem; padding: 0 1.5rem 0 0; border: 0; background: none;
    color: inherit; font-size: inherit; text-align: left; cursor: pointer;
  }
  .who .chevron {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%); font-size: 1.5rem; color: var(--muted);
  }
  .who .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { margin: 0; color: var(--muted); font-size: 0.875rem; }
  .bad { color: var(--danger); }
  .cell { display: flex; align-items: center; gap: 0.25rem; }
  .score {
    width: 6rem; height: 3rem; padding: 0 0.5rem; font-size: 1.125rem; text-align: right;
    font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 0.5rem;
    background: var(--bg); color: var(--text);
  }
  .code { min-width: 3rem; text-align: center; font-weight: 600; }
  .mark { visibility: hidden; width: 0.75rem; color: var(--mark); font-weight: 700; }
  .is-unsaved .mark { visibility: visible; }
  .is-unsaved .score { background: var(--unsaved-bg); }
  .score.over, .score.invalid, .code.invalid { color: var(--danger); }
  .score.invalid, .code.invalid { text-decoration: underline dotted; }
  .score.refused { border: 2px solid var(--danger); }
  .msg { grid-column: 1 / -1; margin: 0; color: var(--danger); }
  .msg:empty { display: none; }
  .empty { padding: 1rem 0; }
  /* While typing, the bottom padding lets the last rows scroll above the keypad bar. */
  .typing .rows { padding-bottom: 6rem; }

  /* Keypad accessory bar: pinned above the on-screen keyboard while a score input has focus */
  .kbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; gap: 0.5rem; max-width: 60rem;
    margin: 0 auto;
    padding: 0.5rem; background: var(--bg2); border-top: 1px solid var(--line);
  }
  .kbar .btn { min-height: 3rem; flex: 1; }
  .kbar .kbar-next { flex: 2; }

  /* Chrome: unsaved badge, storage strip, draft banner, bottom dock (status, alerts, Save) */
  .badge {
    border: 0; background: none; font: inherit; color: var(--mark); font-weight: 600; min-height: 2.75rem;
    cursor: pointer;
  }
  .strip {
    display: block; width: 100%; margin-top: 0.25rem; padding: 0.5rem; border: 0; border-radius: 0.5rem;
    background: var(--unsaved-bg); color: var(--text); text-align: left; font-size: 0.9375rem; cursor: pointer;
  }
  .banner {
    position: relative; margin: 0.5rem 0; padding: 0.75rem 3rem 0.75rem 1rem; border: 1px solid var(--line);
    border-radius: 0.75rem; background: var(--bg2);
  }
  .banner .dismiss { position: absolute; top: 0.25rem; right: 0.25rem; }
  .dismiss { color: var(--muted); margin-left: auto; }
  .dock {
    position: sticky; bottom: 0; z-index: 1; background: var(--bg); border-top: 1px solid var(--line);
    padding: 0.25rem 0 0.5rem;
  }
  /* A short list still has the dock and tab bar at the bottom of the screen */
  main:has(> .dock) {
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  main:has(> .dock) > * { flex-shrink: 0; }
  main > .dock { margin-top: auto; }
  .status { min-height: 1.5rem; margin: 0.25rem 0; }
  .status:empty { min-height: 0; margin: 0; }
  .alert:empty { display: none; }
  .alert { padding: 0.5rem 0; color: var(--text); }
  .alert .actions { align-items: center; margin-top: 0.25rem; }
  .action-bar { display: flex; justify-content: flex-end; }
  .save-btn { min-width: 8rem; min-height: 3rem; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: var(--bg); }
  /* Phone tab bar under the action bar (56 px); the detail covers it */
  .tabs { display: flex; margin: 0.25rem -1rem -0.5rem; border-top: 1px solid var(--line); }
  .tab {
    flex: 1; min-height: 3.5rem; border: 0; background: none; color: var(--muted); font-weight: 600; cursor: pointer;
  }
  .tab[aria-pressed="true"] { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
  @media (min-width: 960px) { .tabs { display: none; } }
  body:has(.detail) .tabs { display: none; }

  /* Dialogs: a bottom sheet on phones, a centred box on wide screens */
  dialog.sheet {
    width: 100%; max-width: 32rem; max-height: 85vh; overflow: auto; margin: auto auto 0; padding: 1rem;
    border: 1px solid var(--line); border-radius: 1rem 1rem 0 0; background: var(--bg); color: var(--text);
  }
  dialog.sheet::backdrop { background: rgba(0, 0, 0, 0.4); }
  @media (min-width: 960px) { dialog.sheet { margin: auto; border-radius: 1rem; } }
  dialog.sheet h2 { font-size: 1.25rem; margin: 0 0 0.75rem; }
  .sheet-actions { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem; margin-top: 0.75rem; }
  .sheet-actions > :only-child { margin-left: auto; }
  .save-col summary {
    display: flex; justify-content: space-between; gap: 0.75rem; min-height: 2.75rem; align-items: center;
    cursor: pointer; border-bottom: 1px solid var(--line);
  }
  .cell-lines { list-style: none; margin: 0.25rem 0 0.5rem; padding: 0; }
  .cell-lines li { padding: 0.125rem 0; }
  .gone { margin-top: 0.5rem; }
  .menu-item {
    display: flex; flex-direction: column; align-items: flex-start; width: 100%; min-height: 3rem;
    padding: 0.5rem 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text);
    text-align: left; cursor: pointer;
  }
  .menu-item:disabled { color: var(--muted); cursor: default; }
  .conf-list { list-style: none; margin: 0; padding: 0; }
  .conf-list li { padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
  .conf-line { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; white-space: pre-wrap; }
  .conf-line .btn { flex-shrink: 0; white-space: nowrap; }

  /* Attendance code buttons: outline, filled when pressed (colour + aria-pressed) */
  .code-btn { min-width: 3.5rem; min-height: 3rem; background: var(--bg); color: var(--text); border-color: var(--line); }
  .code-btn[aria-pressed="true"] { color: #ffffff; }
  .code-P[aria-pressed="true"] { background: #1e6b34; border-color: #1e6b34; }
  .code-L[aria-pressed="true"] { background: #8a5a00; border-color: #8a5a00; }
  .code-A[aria-pressed="true"] { background: #b3261e; border-color: #b3261e; }
  .code-X[aria-pressed="true"] { background: #1558b0; border-color: #1558b0; }

  /* 6. Student detail: full screen on a phone, a 420 px side panel on wide screens */
  .detail {
    position: fixed; inset: 0; z-index: 2; overflow-y: auto; overscroll-behavior: contain;
    padding: 0 1rem 6rem; background: var(--bg); scroll-padding: 12rem 0 5.5rem;
  }
  /* Save, its results and alerts stay reachable over the detail */
  body:has(.detail) .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; padding: 0.25rem 1rem 0.5rem; }
  .det-bar {
    position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0;
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .det-back { max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .det-more { margin-left: auto; }
  .det-bar .badge:not([hidden]) + .det-more { margin-left: 0; }
  .det-who { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.5rem; padding-top: 0.5rem; }
  .det-steps { display: flex; gap: 0.5rem; }
  .det-name { font-size: 1.25rem; margin: 0.25rem 0 0.5rem; }
  /* The totals stay in view while typing further down (S4.2) */
  .det-card {
    position: sticky; top: 3.8rem; z-index: 1; margin-bottom: 0.5rem; padding: 0.5rem 1rem;
    border: 1px solid var(--line); border-radius: 0.75rem; background: var(--bg2);
  }
  .det-big { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 1rem; font-size: 1.25rem; }
  .det-big strong { font-size: 1.75rem; font-variant-numeric: tabular-nums; }
  .det-cat summary {
    display: flex; align-items: center; gap: 0.75rem; min-height: 2.75rem; font-weight: 600; cursor: pointer;
    list-style: none; border-bottom: 1px solid var(--line);
  }
  .det-cat summary::-webkit-details-marker { display: none; }
  .det-cat summary::after { content: "▾"; color: var(--muted); }
  .det-cat:not([open]) summary::after { content: "▸"; }
  .det-cat-name { flex: 1; }
  .det-items { list-style: none; margin: 0; padding: 0 0 0 0.75rem; }
  .codes { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.25rem; }
  .codes .outline { width: 4rem; min-height: 3rem; padding: 0; }

  /* 5. Attendance: code buttons on line 2, Clear apart on the right; the focused student is marked with a bar */
  .row.att { padding: 0.5rem; }
  .att .codes .outline { margin-left: auto; }
  .att:focus-within { background: var(--bg2); box-shadow: inset 4px 0 0 var(--accent); }

  /* 8. Fill Column sheet */
  .fill-cells { display: flex; flex-direction: column; margin: 0 0 0.5rem; padding: 0; border: 0; }
  .fill-cells legend { padding: 0; font-weight: 600; }
  .radio { display: flex; align-items: center; gap: 0.5rem; min-height: 2.75rem; cursor: pointer; }
  .radio input { width: 1.25rem; height: 1.25rem; margin: 0; accent-color: var(--accent); }
  .fill-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin: 0.5rem 0; }
  .fill-row > :first-child { min-width: 3.5rem; font-weight: 600; }
  .fill-row .codes { margin: 0; }
  .fill-count { font-weight: 600; }
  .fill-clear[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  @media (min-width: 960px) {
    .detail { left: auto; width: 26.25rem; border-left: 1px solid var(--line); box-shadow: -4px 0 16px rgba(0, 0, 0, 0.15); }
    body:has(.detail) .kbar, body:has(.detail) .dock { left: auto; width: 26.25rem; }
  }

  /* 14. grade-tui's tabs (SPEC_web_tabs.md): ☰ Categories menu, Summary Scores, Overview */
  .menu-btn { font-size: 1.5rem; }
  .menu-btn:disabled { color: var(--line); cursor: default; }
  .cat-menu {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 5; width: min(80vw, 18rem); overflow-y: auto;
    padding: 0.75rem 0.5rem; background: var(--bg); border-right: 1px solid var(--line);
    box-shadow: 4px 0 16px rgba(0, 0, 0, 0.15);
  }
  .scrim { position: fixed; inset: 0; z-index: 4; background: rgba(0, 0, 0, 0.35); }
  .menu-title { margin: 0 0.5rem 0.5rem; font-weight: 600; color: var(--muted); }
  .menu-list { list-style: none; margin: 0; padding: 0; }
  .cat-item {
    display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; width: 100%; min-height: 2.75rem;
    padding: 0.25rem 0.75rem; border: 0; border-radius: 0.5rem; background: none; color: var(--text);
    font-size: inherit; text-align: left; cursor: pointer;
  }
  .cat-item[aria-current="page"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .cat-item[aria-current="page"] .muted { color: inherit; }
  @media (min-width: 960px) {
    .cat-menu { z-index: 1; width: 14rem; box-shadow: none; }
    body.menu-open main { margin-left: 14rem; }
  }
  .view-summary .col-picker > :not(.search-row), .view-summary .fill-btn, .view-summary .empty,
  .view-analytics .col-picker, .view-analytics .empty { display: none; }
  .view-summary .col-picker { border-bottom: 0; }
  .grade-text { font-weight: 700; }
  .tb td.c-grade { text-align: center; }
  .link {
    width: 100%; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left;
    overflow: hidden; text-overflow: ellipsis; cursor: pointer;
  }
  .sum-item { border-bottom: 1px solid var(--line); }
  .sum-row {
    display: grid; grid-template-columns: 1fr auto 2.5rem 1.25rem; align-items: center; column-gap: 0.5rem;
    width: 100%; min-height: 3rem; padding: 0.5rem 0; border: 0; background: none; color: inherit; font: inherit;
    text-align: left; cursor: pointer;
  }
  .sum-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sum-final { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .sum-grade { text-align: center; }
  .sum-row .chevron { color: var(--muted); }
  .sum-more { padding: 0 0 0.75rem; }
  .sum-fields { display: grid; grid-template-columns: 1fr auto; gap: 0.25rem 1rem; margin: 0 0 0.75rem; }
  .sum-fields dd, .ov-stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .overview { display: grid; gap: 1rem; padding: 0.75rem 0 1rem; }
  .overview:empty { display: none; }
  @media (min-width: 960px) { .overview { grid-template-columns: 2fr 3fr; } }
  .ov-panel { padding: 0.75rem 1rem; border: 1px solid var(--line); border-radius: 0.75rem; min-width: 0; }
  .ov-panel h2 { margin: 0 0 0.5rem; font-size: 1.125rem; }
  .ov-stats { display: grid; grid-template-columns: 1fr auto; gap: 0.25rem 1rem; margin: 0; }
  .dist.hist li { grid-template-columns: 4.5rem 1fr 7.5rem; }
  .dist .bar span.plain { color: var(--accent); }
  .bp { display: block; width: 100%; height: 3rem; overflow: visible; }
  .bp-line { stroke: var(--text); stroke-width: 1.5; }
  .bp-box { fill: var(--bg2); stroke: var(--text); stroke-width: 1.5; }
  .bp-median { stroke: var(--accent); stroke-width: 3; }
  .bp-mean { stroke: var(--mark); stroke-width: 2; stroke-dasharray: 3 2; }
