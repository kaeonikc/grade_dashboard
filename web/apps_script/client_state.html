<script>
'use strict';
// Browser state (web/SPEC.md "Modules"): the course list, the open course with its grades, and the server calls.
// Csv, Grades and Journal come from the injected modules (Index.html, ADR 004).

const DRAFT_PREFIX = 'gw:draft:';
const UI_PREFIX = 'gw:ui:';

const state = {
  now: null,         // server time of the last reply: every {ago} counts from it, never from the device clock
  nowAt: 0,          // device clock (ms) when `now` arrived
  courses: null,     // listCourses().courses
  open: null,        // the loadCourse reply of the open course (its journal kept current by every reply)
  rows: [],          // Grades.mergeCourse: students in Raw Details order
  byId: new Map(),   // student_id -> row
  max: {},           // Grades.fillDefaultMax: each column's max with the current weights
  edits: new Map(),  // unsaved edits, editKey -> {student_id, column, value, original} (the draft's edit shape)
  editsPush: null,   // push_id the unsaved edits were made on (an older one after a draft from before a push)
  notFound: new Set(),  // editKeys the last Save reported `not found`
  grades: [],        // Grades.computeGrades over the saved values plus the unsaved edits, one per row
  gradeById: new Map(),  // student_id -> its entry in grades
  groups: new Map(), // student_id -> Class Group from the roster (shown in the detail)
  view: 'scores',    // 'table' (wide screens only) or 'scores'
  column: null,      // the picked columns[].name in column mode
  search: '',        // the search box text
  saving: false,     // a Save or Undo is on its way: edits are locked
  storageOff: false, // localStorage refused a write: the draft can't be kept (S8.8)
};

// google.script.run as a promise. A failed call (network, server exception, time limit) rejects.
function server(name, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args);
  });
}

// How many unsaved edits this browser holds as a draft for the course (0 when none, or storage is blocked).
function draftCount(folder) {
  try {
    const draft = JSON.parse(localStorage.getItem(DRAFT_PREFIX + folder) || 'null');
    return draft && Array.isArray(draft.edits) ? draft.edits.length : 0;
  } catch (e) {
    return 0;
  }
}

function setNow(reply) {
  state.now = reply.now;
  state.nowAt = Date.now();
}

// The server clock now, estimated from the last reply, as ISO text with the server's offset (draft made_at).
function serverNow() {
  const m = /([+-])(\d{2}):(\d{2})$/.exec(state.now);
  const offset = m ? (m[1] === '-' ? -1 : 1) * (+m[2] * 60 + +m[3]) : 0;
  const t = new Date(Date.parse(state.now) + Date.now() - state.nowAt + offset * 60000);
  return t.toISOString().slice(0, 19) + (m ? m[0] : 'Z');
}

function loadCourses() {
  return server('listCourses').then((reply) => {
    setNow(reply);
    state.courses = reply.ok ? reply.courses : null;
    return reply;
  });
}

// Opens a course with this device's draft applied: {reply, draft} where draft is restoreDraft's result.
function openCourse(folder) {
  return server('loadCourse', folder).then((reply) => {
    setNow(reply);
    if (!reply.ok) return { reply };
    useCourse(reply);
    state.edits = new Map();
    state.notFound = new Set();
    state.editsPush = reply.push.push_id;
    state.search = '';
    state.storageOff = !storageWorks();
    const ui = uiMemory(folder);
    const known = reply.course.columns.some((c) => c.name === ui.column);
    state.column = known ? ui.column : null;
    const draft = restoreDraft();
    recompute();
    return { reply, draft };
  });
}

// Reload from Drive: the unsaved edits stay on top, still checked against their start values on Save.
function reloadCourse() {
  return server('loadCourse', state.open.folder).then((reply) => {
    setNow(reply);
    if (reply.ok) {
      useCourse(reply);
      recompute();
    }
    return reply;
  });
}

function useCourse(reply) {
  state.open = reply;
  state.rows = Grades.mergeCourse(reply.course, reply.roster, reply.files);
  state.byId = new Map(state.rows.map((r) => [r.student_id, r]));
  state.max = Grades.fillDefaultMax(reply.course);
  state.groups = classGroups(reply.roster);
}

// Class Group per student, when the roster has that column.
function classGroups(rosterText) {
  const doc = Csv.parse(rosterText);
  const header = doc.header.map((h) => h.trim());
  const iId = header.indexOf('Student ID');
  const iGroup = header.indexOf('Class Group');
  const groups = new Map();
  if (iId >= 0 && iGroup >= 0) for (const r of doc.rows) groups.set((r[iId] || '').trim(), (r[iGroup] || '').trim());
  return groups;
}

// Back to the course list: the unsaved edits stay only in the draft.
function closeCourse() {
  state.open = null;
  state.edits = new Map();
}

function recompute() {
  state.grades = Grades.computeGrades(state.open.course, state.rows, Array.from(state.edits.values()));
  state.gradeById = new Map(state.grades.map((g) => [g.student_id, g]));
}

// A student's grades from the saved values plus the unsaved edits, or (S4.2 preview) with one more value typed
// into `column` and not yet committed.
function gradeOf(row, column, value) {
  if (column == null) return state.gradeById.get(row.student_id);
  const overlay = Array.from(state.edits.values()).concat({ student_id: row.student_id, column, value });
  return Grades.computeGrades(state.open.course, [row], overlay)[0];
}

// ---- Draft (gw:draft:<folder>): IDs and values only, no names (S8.4, S8.8) ----
function storageWorks() {
  try {
    localStorage.setItem('gw:test', '1');
    localStorage.removeItem('gw:test');
    return true;
  } catch (e) {
    return false;
  }
}

// Replaces the draft with the unsaved edits, or removes it when there are none.
function saveDraft() {
  const key = DRAFT_PREFIX + state.open.folder;
  try {
    if (state.edits.size) {
      localStorage.setItem(key, JSON.stringify({ v: 1, made_at: serverNow(), push: state.editsPush,
        edits: Array.from(state.edits.values()) }));
    } else {
      localStorage.removeItem(key);
    }
  } catch (e) {
    state.storageOff = true;
  }
}

// Puts the draft's edits back as unsaved edits, whatever its age. Edits already on Drive are dropped; edits for
// students or columns no longer in the course are kept (Save reports them, edge 38). Returns null (no draft),
// {already, made_at} (every edit was on Drive; the draft is removed) or {count, made_at, pushed, gone}.
function restoreDraft() {
  let draft;
  try {
    draft = JSON.parse(localStorage.getItem(DRAFT_PREFIX + state.open.folder) || 'null');
  } catch (e) {
    return null;
  }
  if (!draft || draft.v !== 1 || !Array.isArray(draft.edits) || !draft.edits.length) return null;
  let gone = 0;
  for (const d of draft.edits) {
    const e = { student_id: d.student_id, column: d.column, value: d.value, original: d.original };
    if (isGone(e)) gone += 1;
    else if (Grades.sameCell(e.value, savedValue(state.byId.get(e.student_id), e.column))) continue;
    state.edits.set(editKey(e.student_id, e.column), e);
  }
  if (!state.edits.size) {
    saveDraft();
    return { already: true, made_at: draft.made_at };
  }
  state.editsPush = draft.push;
  return { count: state.edits.size, made_at: draft.made_at, pushed: draft.push !== state.open.push.push_id, gone };
}

// An edit for a student or column the open course doesn't have, or that the last Save didn't find on Drive.
function isGone(e) {
  return !state.byId.has(e.student_id) || !state.open.course.columns.some((c) => c.name === e.column) ||
    state.notFound.has(editKey(e.student_id, e.column));
}

function dropGone() {
  for (const [key, e] of state.edits) if (isGone(e)) state.edits.delete(key);
  saveDraft();
}

function discardEdits() {
  state.edits = new Map();
  state.notFound = new Set();
  saveDraft();
  recompute();
}

// ---- Save and Undo (SPEC "Saving", "Undo last save") ----
// Sends every unsaved edit. Resolves with the server reply (applied when ok); rejects when the call failed, with
// every edit kept.
function saveEdits() {
  state.saving = true;
  const edits = Array.from(state.edits.values());
  return server('saveBatch', state.open.folder, edits, state.editsPush).then((reply) => {
    state.saving = false;
    setNow(reply);
    if (reply.ok) applySaved(reply);
    return reply;
  }, (err) => {
    state.saving = false;
    throw err;
  });
}

// Saved and already cells leave the unsaved edits; a cell changed elsewhere stays unsaved with the Drive value
// as its new start value, so a second Save writes it on purpose (S8.2).
function applySaved(reply) {
  for (const c of reply.saved.concat(reply.already)) {
    setSaved(c.student_id, c.column, c.value);
    state.edits.delete(editKey(c.student_id, c.column));
  }
  state.notFound = new Set();
  for (const c of reply.conflicts) {
    const e = state.edits.get(editKey(c.student_id, c.column));
    if (c.reason === 'not found') state.notFound.add(editKey(c.student_id, c.column));
    else if (e) {
      setSaved(c.student_id, c.column, c.now);
      e.original = c.now;
    }
  }
  state.open.journal = reply.journal;
  state.editsPush = state.open.push.push_id;
  saveDraft();
  recompute();
}

function undoLastSave(batch) {
  state.saving = true;
  return server('undoLastSave', state.open.folder, batch).then((reply) => {
    state.saving = false;
    setNow(reply);
    if (reply.journal) state.open.journal = reply.journal;
    if (reply.ok) {
      for (const c of reply.saved.concat(reply.already)) setSaved(c.student_id, c.column, c.value);
      for (const c of reply.conflicts) if (c.now != null) setSaved(c.student_id, c.column, c.now);
      recompute();
    }
    return reply;
  }, (err) => {
    state.saving = false;
    throw err;
  });
}

// The Drive value of a cell, as the server just reported it.
function setSaved(sid, column, value) {
  const row = state.byId.get(sid);
  if (row) row.cells[column] = value;
}

// How a failed call reads (Interface "Failures"): offline, auth or other.
function failureKind(err) {
  if (navigator.onLine === false) return 'offline';
  return /authoriz|sign[ -]?in|log[ -]?in|\b40[13]\b/i.test(String(err && err.message || err)) ? 'auth' : 'other';
}

// The browser's own prompt where it works; iOS Safari often ignores it, so the draft is the real protection.
window.addEventListener('beforeunload', (e) => {
  if (state.open && state.edits.size) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// ---- UI memory per device (gw:ui:<folder>): column names and the tab only, no PII ----
function uiMemory(folder) {
  try {
    const ui = JSON.parse(localStorage.getItem(UI_PREFIX + folder) || 'null');
    return ui && ui.v === 1 ? ui : {};
  } catch (e) {
    return {};
  }
}

function pickColumn(name) {
  state.column = name;
  try {
    localStorage.setItem(UI_PREFIX + state.open.folder, JSON.stringify({ v: 1, column: name, tab: 'scores' }));
  } catch (e) {
    state.storageOff = true;  // only the remembered column is lost, but drafts can't be kept either (S8.8)
  }
}

// ---- Cells and unsaved edits ----
const editKey = (sid, column) => sid + '\u0000' + column;
const savedValue = (row, column) => row.cells[column] || '';

function edited(row, column) { return state.edits.get(editKey(row.student_id, column)); }

// What the cell holds now: the unsaved value, else the Drive value.
function cellValue(row, column) {
  const e = edited(row, column);
  return e ? e.value : savedValue(row, column);
}

// Puts a canonical value in a cell as an unsaved edit; a value that means the Drive value removes the edit (S3.6).
function setCell(row, column, value) {
  const key = editKey(row.student_id, column);
  const original = savedValue(row, column);
  if (Grades.sameCell(value, original)) state.edits.delete(key);
  else state.edits.set(key, { student_id: row.student_id, column, value, original });
  if (!state.edits.size) state.editsPush = state.open.push.push_id;
  saveDraft();
  recompute();
}

// Typed text committed to a cell (Interface "Typing rules"): {changed} or {refused: message}.
function commitTyped(row, column, text) {
  if (Grades.sameCell(text, cellValue(row, column))) return { changed: false };
  const r = Grades.validateTyped(text);
  if (!r.ok) return { refused: refusalText(text.trim(), r.reason) };
  setCell(row, column, r.value);
  return { changed: true };
}

// Copy table bad.comma / bad.negative / bad.other.
function refusalText(text, reason) {
  if (reason === 'comma') {
    return "'" + text + "': use . for decimals" + (/^\d+,\d+$/.test(text) ? ' (' + text.replace(',', '.') + ')' : '');
  }
  if (reason === 'negative') return "'" + text + "' is negative; scores start at 0";
  return "'" + text + "' isn't a score. Use a number (8.5), ขส, or leave it blank.";
}

function editCount(row) {
  let n = 0;
  for (const e of state.edits.values()) if (e.student_id === row.student_id) n += 1;
  return n;
}

// Attendance text that isn't a code counts as 0 and is drawn red (S6, "not a code").
function badCode(value) {
  const code = value.trim();
  return code !== '' && !Object.prototype.hasOwnProperty.call(Grades.CODE_VALUE, code);
}

// Above the column's max (accepted, drawn red: S3.5, edge 41).
function overMax(value, column) {
  const c = Grades.classify(value);
  return c[0] === 'num' && c[1] > maxOf(column);
}

function maxOf(column) {
  return Object.prototype.hasOwnProperty.call(state.max, column) ? state.max[column] : 100;
}

// How many students have a non-blank value in the column, unsaved values included.
function enteredCount(column) {
  return state.rows.filter((r) => cellValue(r, column).trim() !== '').length;
}

// Search (S3.8): ID or name substring, trimmed, case-insensitive for Latin letters.
function matches(row, query) {
  const q = query.trim().toLowerCase();
  return q === '' || row.student_id.toLowerCase().includes(q) || row.name.toLowerCase().includes(q);
}
</script>
