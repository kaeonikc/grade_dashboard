<script>
'use strict';
// Screens (web/SPEC.md "Interface"): the course list, opening a course, column mode, and the Save, Discard,
// Undo, Leave and More dialogs.
// Every piece of course data goes in as text (textContent), never as HTML.

const SLOW_MS = 8000;
const THAI = /[฀-๿]/;
const app = document.getElementById('app');
const F = Journal.fmt;

// A DOM element. Children are nodes or text; `onclick` is the one event attribute.
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'onclick') node.addEventListener('click', v); else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null && c !== false) node.append(c instanceof Node ? c : String(c));
  return node;
}

// Data shown verbatim (names, course names, headers); Thai is marked so VoiceOver reads it in Thai.
function data(tag, attrs, text) {
  return el(tag, Object.assign(THAI.test(text) ? { lang: 'th' } : {}, attrs), text);
}

function button(label, onclick, cls) {
  return el('button', { type: 'button', class: cls || 'btn', onclick }, label);
}

// Replaces the screen and moves focus to its heading.
function show(...nodes) {
  app.replaceChildren(...nodes);
  window.scrollTo(0, 0);
  const h = app.querySelector('h1');
  if (h) { h.setAttribute('tabindex', '-1'); h.focus(); }
}

function notice(title, body, ...buttons) {
  return el('section', { class: 'notice' }, el('p', { class: 'notice-title' }, title),
    body ? el('p', { class: 'muted' }, body) : null, el('div', { class: 'actions' }, ...buttons));
}

// ---- 2. Course list (S2.1, S2.3) ----
function listHeader() {
  return el('header', { class: 'page-head' }, el('h1', {}, 'grade_web'),
    el('p', { class: 'muted' }, 'Courses on Drive'));
}

function showCourses() {
  show(listHeader(), el('div', { class: 'card placeholder', 'aria-hidden': 'true' }),
    el('div', { class: 'card placeholder', 'aria-hidden': 'true' }), el('p', { class: 'muted' }, 'Loading courses…'));
  loadCourses().then((reply) => {
    if (reply.ok && reply.courses.length) return show(listHeader(), courseList(reply.courses));
    if (reply.ok || reply.code === 'NOT_FOUND') {
      return show(listHeader(), notice('No pushed courses yet.', 'On the Mac, run grader web-push <course>, wait ' +
        'for Drive to finish uploading, then reload this page.', button('Reload', showCourses)));
    }
    show(listHeader(),
      notice('Drive is busy with a save from another device.', null, button('Try again', showCourses)));
  }, () => {
    show(listHeader(), notice("Couldn't load the course list.", 'Check your connection, then try again.',
      button('Try again', showCourses)));
  });
}

function courseList(courses) {
  const names = courses.filter((c) => c.available).map((c) => c.course_name);
  const shared = (name) => names.indexOf(name) !== names.lastIndexOf(name);
  return el('ul', { class: 'courses' }, ...courses.map((c) => el('li', {}, c.available
    ? courseCard(c, shared(c.course_name))
    : el('div', { class: 'card unavailable' },
      el('p', { class: 'card-title' }, '⚠ ', data('span', {}, c.folder), ' ',
        el('span', { class: 'tag' }, 'Unavailable')),
      el('p', {}, c.reason)))));
}

function courseCard(c, showFolder) {
  const drafts = draftCount(c.folder);
  return el('button', { type: 'button', class: 'card course', onclick: () => showCourse(c.folder, c.course_name) },
    data('span', { class: 'card-title' }, c.course_name),
    showFolder ? data('span', { class: 'muted' }, c.folder) : null,
    el('span', {}, c.course_id + ' · ' + c.term),
    el('span', {}, 'Pushed ' + F.fmtTime(c.pushed_at, state.now)),
    el('span', {}, F.journalLine(c, state.now)),
    c.older_push ? el('span', { class: 'warn' }, "Some of these edits were saved while the latest push was " +
      "syncing. They're kept; pull them on the Mac: grader web-pull") : null,
    drafts ? el('span', { class: 'unsaved' }, '● ' + drafts + ' unsaved on this device') : null,
    el('span', { class: 'chevron', 'aria-hidden': 'true' }, '›'));
}

// ---- 3. Opening a course ----
function showCourse(folder, courseName) {
  const back = button('Back to courses', showCourses);
  const slow = el('p', { class: 'muted' });
  show(el('section', { class: 'opening' }, data('h1', {}, courseName),
    el('div', { class: 'spinner', 'aria-hidden': 'true' }),
    el('p', {}, 'Opening ', data('span', {}, courseName), '…'),
    el('p', { class: 'muted' }, 'Reading the course from Drive'), slow));
  const timer = setTimeout(() => {
    slow.textContent = 'Still working. Large courses take a little longer.';
  }, SLOW_MS);
  const failed = (cause) => show(listHeader(),
    notice(el('span', {}, "Couldn't open ", data('span', {}, courseName), '.'), cause,
      button('Try again', () => showCourse(folder, courseName)), back));
  openCourse(folder).then(({ reply, draft }) => {
    clearTimeout(timer);
    if (reply.ok) return show(...courseView(draft));
    if (reply.code === 'BUSY') return failed('Drive is busy with a save from another device. Try again in a moment.');
    show(listHeader(), notice(el('span', {}, "Can't open ", data('span', {}, courseName), '.'), reply.message, back));
  }, () => {
    clearTimeout(timer);
    failed(navigator.onLine === false ? "You're offline. Connect, then try again." :
      "Google didn't answer. Try again in a moment.");
  });
}

// ---- 4. Scores: column mode (S3) ----
const STATUS_MS = 4000;
let cm = null;  // the open column mode: its controls, one item per student row, and the focused item

// draft: openCourse's restoreDraft result, shown as the draft banner (null: none).
function courseView(draft) {
  const o = state.open;
  cm = { items: [], current: null, statusTimer: null, working: null };
  cm.badge = el('button', { type: 'button', class: 'badge unsaved', hidden: '', onclick: openSaveSheet });
  cm.headLine = el('p', { class: 'muted' });
  cm.strip = storageStrip();
  const head = el('header', { class: 'course-head' },
    el('div', { class: 'course-bar' },
      el('button', { type: 'button', class: 'icon', 'aria-label': 'Courses', onclick: () => leave(showCourses) }, '‹'),
      data('h1', { class: 'course-name' }, o.course.course_name), cm.badge,
      el('button', { type: 'button', class: 'icon', 'aria-label': 'More', 'aria-haspopup': 'dialog', onclick: openMore },
        '⋯')),
    cm.headLine, cm.strip);

  cm.select = el('select', { id: 'col', class: 'col-select' });
  cm.select.addEventListener('change', () => choose(cm.select.value));
  cm.prev = el('button', { type: 'button', class: 'icon', 'aria-label': 'Previous column', onclick: () => step(-1) },
    '‹');
  cm.next = el('button', { type: 'button', class: 'icon', 'aria-label': 'Next column', onclick: () => step(1) }, '›');
  cm.line = el('p', { class: 'muted col-line' });
  cm.search = el('input', { type: 'text', id: 'search', class: 'search-input', placeholder: 'Search ID or name',
    'aria-label': 'Search students', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
  cm.search.value = state.search;
  cm.search.addEventListener('input', () => { state.search = cm.search.value; applySearch(); });
  cm.clear = el('button', { type: 'button', class: 'icon search-clear', 'aria-label': 'Clear search',
    onclick: clearSearch }, '×');
  const picker = el('section', { class: 'col-picker' },
    el('label', { for: 'col' }, 'Column'),
    el('div', { class: 'col-row' }, cm.prev, cm.select, cm.next), cm.line,
    el('div', { class: 'search' }, cm.search, cm.clear));

  cm.list = el('ul', { class: 'rows' });
  cm.empty = el('div', { class: 'empty' });
  cm.nextBtn = el('button', { type: 'button', class: 'btn kbar-next', onclick: () => move(1) }, 'Next ↓');
  cm.bar = el('div', { class: 'kbar', hidden: '' },
    el('button', { type: 'button', class: 'btn outline', lang: 'th', onclick: () => barSet('ขส', true) }, 'ขส'),
    el('button', { type: 'button', class: 'btn outline', onclick: () => barSet('', false) }, 'Clear'),
    cm.nextBtn);
  // Keep the input focused so the keypad stays open (iOS): the buttons act on the focused student.
  cm.bar.addEventListener('pointerdown', (e) => e.preventDefault());
  cm.status = el('p', { class: 'status', role: 'status' });
  cm.alert = el('div', { class: 'alert', role: 'alert' });
  cm.saveBtn = button('', openSaveSheet, 'btn save-btn');
  cm.dock = el('div', { class: 'dock' }, cm.alert, cm.status, el('div', { class: 'action-bar' }, cm.saveBtn));
  cm.announce = el('p', { class: 'sr-only', 'aria-live': 'polite' });
  cm.banner = draftBanner(draft);
  renderColumn();
  return [head, cm.banner, picker, cm.list, cm.empty, cm.announce, cm.dock, cm.bar].filter(Boolean);
}

// Storage refused (S8.8, edge 40): one line under the header on every course screen; a tap shows why.
function storageStrip() {
  const more = el('span', { hidden: '' },
    ' Storage is blocked here (for example in a private window). Saved edits on Drive are safe.');
  const strip = el('button', { type: 'button', class: 'strip', 'aria-expanded': 'false', hidden: '' },
    "Unsaved edits can't be backed up in this browser. Save often: closing this tab loses them.", more);
  strip.addEventListener('click', () => {
    more.hidden = !more.hidden;
    strip.setAttribute('aria-expanded', String(!more.hidden));
  });
  return strip;
}

// Draft found on opening (S8.4, edge 38). Dismissing keeps the edits.
function draftBanner(draft) {
  if (!draft) return null;
  const box = el('section', { class: 'banner', 'aria-label': 'Draft' });
  const dismiss = el('button', { type: 'button', class: 'icon dismiss', 'aria-label': 'Dismiss',
    onclick: () => box.remove() }, '×');
  if (draft.already) {
    box.append(el('p', {}, 'Your draft from ' + F.fmtTime(draft.made_at, state.now) +
      ' is already on Drive; nothing to restore.'), dismiss);
    return box;
  }
  box.append(
    el('p', { class: 'notice-title' }, F.plural(draft.count, 'unsaved edit') + ' restored (' +
      F.draftAge(draft.made_at, state.now) + ')'),
    el('div', {}, draft.pushed ? el('p', {}, 'The course was pushed again since then; each edit is checked when you ' +
      'save.') : null, draft.gone ? el('p', {}, (draft.gone === 1 ? '1 is for a student or column'
      : draft.gone + ' are for students or columns') + ' no longer in this course.') : null),
    el('div', { class: 'actions' }, button('Review', openSaveSheet, 'btn outline'),
      button('Discard…', openDiscard, 'btn outline')), dismiss);
  return box;
}

// Columns grouped by category in category_order (attendance sessions included; total columns are never listed).
function renderPicker() {
  const course = state.open.course;
  const opts = [el('option', { value: '', disabled: '' }, 'Pick a column')];
  for (const cat of course.category_order) {
    const cols = course.columns.filter((c) => c.category === cat);
    if (cols.length) opts.push(el('optgroup', { label: cat }, ...cols.map((c) => optionFor(c))));
  }
  cm.select.replaceChildren(...opts);
  cm.select.value = state.column || '';
  const i = columnIndex();
  cm.prev.disabled = i <= 0;
  cm.next.disabled = i < 0 || i >= course.columns.length - 1;
}

function optionFor(c) {
  return data('option', { value: c.name }, c.header + ' · ' + enteredCount(c.name) + '/' + state.rows.length);
}

function columnIndex() { return state.open.course.columns.findIndex((c) => c.name === state.column); }
function currentColumn() { return state.open.course.columns[columnIndex()]; }

function choose(name) {
  pickColumn(name);
  renderColumn();
}

function step(delta) {
  const cols = state.open.course.columns;
  const i = columnIndex() + delta;
  if (i >= 0 && i < cols.length) choose(cols[i].name);
}

function renderColumn() {
  renderPicker();
  cm.current = null;
  keypad(false);
  const col = currentColumn();
  cm.items = col ? state.rows.map((row, i) => rowItem(row, col, i)) : [];
  cm.list.replaceChildren(...cm.items.map((it) => it.li));
  refreshCounts();
  applySearch();
}

// One student: ID, name and sub-line on the left, the value on the right (an input for a score column).
function rowItem(row, col, i) {
  const it = { row, col, sub: el('p', { class: 'sub', id: 'sub-' + i }) };
  it.msg = el('p', { class: 'msg', id: 'msg-' + i, role: 'alert' });
  const who = el('div', { class: 'who' }, el('span', { class: 'id' }, row.student_id),
    data('span', { class: 'name' }, row.name), it.sub);
  if (col.category === 'attendance') {
    // Session codes are shown as written; they are entered on the Attendance tab.
    it.value = el('span', { class: 'code' });
  } else {
    it.value = el('input', { type: 'text', inputmode: 'decimal', enterkeyhint: 'next', autocomplete: 'off',
      autocorrect: 'off', spellcheck: 'false', class: 'score', 'aria-describedby': it.sub.id + ' ' + it.msg.id });
    it.value.setAttribute('aria-label', col.header + ' for ' + row.name + ' ' + row.student_id);
    inputEvents(it);
  }
  it.li = el('li', { class: 'row' }, who,
    el('div', { class: 'cell' }, it.value, el('span', { class: 'mark', 'aria-hidden': 'true' }, '*')), it.msg);
  refreshItem(it);
  return it;
}

function inputEvents(it) {
  const input = it.value;
  input.addEventListener('focus', () => {
    cm.current = it;
    input.select();
    keypad(true);
    placeBar();
    cm.nextBtn.textContent = nextVisible(it, 1) ? 'Next ↓' : 'Done';
  });
  // The refusal shows live while typing; nothing is committed until Next, Enter, Tab or leaving the field.
  input.addEventListener('input', () => {
    const text = input.value;
    const r = Grades.validateTyped(text);
    refuse(it, Grades.sameCell(text, cellValue(it.row, it.col.name)) || r.ok ? '' : refusalText(text.trim(), r.reason));
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === 'Tab') {
      e.preventDefault();
      move(e.shiftKey ? -1 : 1);
    } else if (e.key === 'Escape') {
      refreshItem(it);
      refuse(it, '');
    }
  });
  input.addEventListener('blur', (e) => {
    if (!cm.bar.contains(e.relatedTarget)) keypad(false);
    // Leaving with refused text puts the previous value back; its message stays until the next commit.
    if (!commit(it)) {
      refreshItem(it);
      it.value.classList.remove('refused');
    }
  });
}

// Commits the focused text (Interface "Typing rules"). False when refused: focus and the previous value stay.
function commit(it) {
  const r = commitTyped(it.row, it.col.name, it.value.value);
  if (r.refused) {
    refuse(it, r.refused);
    return false;
  }
  refuse(it, '');
  refreshItem(it);
  if (r.changed) {
    refreshCounts();
    announceCommit(it);
  }
  return true;
}

function refuse(it, message) {
  it.msg.textContent = message;
  it.value.classList.toggle('refused', message !== '');
}

// Next (delta 1) or previous (-1) visible student; past the last one, Done closes the keypad.
function move(delta) {
  const it = cm.current;
  if (!it) return;
  if (!commit(it)) {
    it.value.select();  // the next keystroke replaces the refused text
    return;
  }
  const to = nextVisible(it, delta);
  if (to) {
    to.value.focus({ preventScroll: true });
    reveal(to.li);
  } else if (delta > 0) {
    it.value.blur();
    const col = it.col.name;
    say('End of list · ' + enteredCount(col) + ' of ' + state.rows.length + ' entered');
  }
}

// The keypad bar replaces the bottom dock while an input has focus (iOS covers the bottom of the page).
function keypad(open) {
  cm.bar.hidden = !open;
  cm.dock.hidden = open;
  document.body.classList.toggle('typing', open);
}

// ขส moves on to the next student (S3.4); Clear stays.
function barSet(value, thenNext) {
  const it = cm.current;
  if (!it || state.saving) return;
  it.value.value = value;
  if (thenNext) move(1);
  else commit(it);
}

function nextVisible(it, delta) {
  for (let i = cm.items.indexOf(it) + delta; i >= 0 && i < cm.items.length; i += delta) {
    if (!cm.items[i].li.hidden) return cm.items[i];
  }
  return null;
}

// Scrolls a row to the middle of the space between the sticky header and the keypad bar.
function reveal(li) {
  const vv = window.visualViewport;
  const top = (vv ? vv.offsetTop : 0) + document.querySelector('.course-head').offsetHeight;
  const bottom = (vv ? vv.offsetTop + vv.height : window.innerHeight) - (cm.bar.hidden ? 0 : cm.bar.offsetHeight);
  const r = li.getBoundingClientRect();
  window.scrollBy(0, r.top + r.height / 2 - (top + bottom) / 2);
}

// Pins the keypad bar just above the on-screen keyboard (visualViewport shrinks while it is open).
function placeBar() {
  if (!cm || !cm.bar.isConnected || cm.bar.hidden) return;
  const vv = window.visualViewport;
  const covered = vv ? window.innerHeight - vv.offsetTop - vv.height : 0;
  cm.bar.style.bottom = Math.max(0, covered) + 'px';
}

function refreshItem(it) {
  const name = it.col.name;
  const value = cellValue(it.row, name);
  const e = edited(it.row, name);
  const over = overMax(value, name);
  // An attendance code isn't a number: only score columns mark text as invalid.
  const invalid = it.col.category !== 'attendance' && Grades.classify(value)[0] === 'invalid';
  if (it.value.tagName === 'INPUT') it.value.value = value; else it.value.textContent = value;
  it.li.classList.toggle('is-unsaved', !!e);
  it.value.classList.toggle('over', over);
  it.value.classList.toggle('invalid', invalid);
  const parts = [];
  if (e) parts.push(el('span', {}, 'was ' + (e.original.trim() === '' ? 'blank' : e.original)));
  if (over) parts.push(el('span', { class: 'bad' }, 'above max ' + fmtMax(name)));
  if (invalid) parts.push(el('span', { class: 'bad' }, 'not a number, counts as 0'));
  it.sub.replaceChildren(...parts.flatMap((p, i) => (i ? [' · ', p] : [p])));
}

function fmtMax(column) { return String(Grades.round2(maxOf(column))); }

// Column line, the picked option's progress and the unsaved badge.
function refreshCounts() {
  const col = currentColumn();
  const k = col ? enteredCount(col.name) : 0;
  const total = state.rows.length;
  const max = col && col.category !== 'attendance' ? ' · max ' + fmtMax(col.name) : '';
  cm.line.textContent = col ? col.category + max + ' · ' + k + ' of ' + total + ' entered' : '';
  const opt = col && cm.select.selectedOptions[0];
  if (opt) opt.textContent = col.header + ' · ' + k + '/' + total;
  refreshChrome();
}

// The unsaved badge, the Save button, header line 2, the storage strip, and inputs locked while saving (S8.9).
function refreshChrome() {
  const n = state.edits.size;
  const j = state.open.journal;
  const pushed = state.open.push.pushed_at;
  cm.badge.hidden = n === 0;
  cm.badge.replaceChildren(el('span', { 'aria-hidden': 'true' }, '● '), n + ' unsaved',
    el('span', { class: 'sr-only' }, n === 1 ? ' edit' : ' edits'));
  cm.saveBtn.hidden = n === 0;
  cm.saveBtn.disabled = state.saving;
  cm.saveBtn.textContent = state.saving && cm.working ? cm.working : 'Save ' + n;
  cm.headLine.textContent = state.saving && cm.working ? cm.working : 'Pushed ' + F.fmtTime(pushed, state.now) +
    ' (' + F.fmtAgo(pushed, state.now) + ')' + (j.unpulled ? ' · ' + F.plural(j.unpulled, 'edit') + ' not pulled' : '');
  cm.strip.hidden = !state.storageOff;
  for (const it of cm.items) if (it.value.tagName === 'INPUT') it.value.readOnly = state.saving;
}

function announceCommit(it) {
  const value = cellValue(it.row, it.col.name);
  cm.announce.replaceChildren(it.col.name + ' ' + (value.trim() === '' ? 'blank' : value) + ' for ',
    data('span', {}, it.row.name), (edited(it.row, it.col.name) ? ', unsaved. ' : '. ') + state.edits.size +
    ' unsaved.');
}

function say(text) {
  clearTimeout(cm.statusTimer);
  cm.status.textContent = text;
  cm.statusTimer = setTimeout(() => { cm.status.textContent = ''; }, STATUS_MS);
}

// A message that stays until dismissed (conflicts, failures), with its buttons.
function alertBox(text, ...buttons) {
  cm.alert.replaceChildren(el('p', {}, text), el('div', { class: 'actions' }, ...buttons,
    el('button', { type: 'button', class: 'icon dismiss', 'aria-label': 'Dismiss',
      onclick: () => cm.alert.replaceChildren() }, '×')));
}

const shown = (value) => (String(value == null ? '' : value).trim() === '' ? 'blank' : value);

// ---- Dialogs (9-12 and the More sheet). The element with `autofocus` gets the initial focus ----
let dialogCount = 0;
function dialog(title, ...content) {
  const id = 'dialog-' + (++dialogCount);
  const d = el('dialog', { class: 'sheet', 'aria-labelledby': id }, el('h2', { id }, title), ...content);
  d.addEventListener('close', () => d.remove());
  document.body.append(d);
  d.showModal();
  return d;
}

function autofocused(node) {
  node.setAttribute('autofocus', '');
  return node;
}

// ---- 9. Save (S8) ----
function openSaveSheet() {
  if (!state.edits.size || state.saving) return;
  const edits = Array.from(state.edits.values());
  const gone = edits.filter(isGone);
  const n = edits.length;
  let over = 0;
  const groups = state.open.course.columns.map((c) => {
    const es = edits.filter((e) => e.column === c.name && !isGone(e));
    if (!es.length) return null;
    const m = es.filter((e) => overMax(e.value, c.name)).length;
    over += m;
    return el('details', { class: 'save-col' },
      el('summary', {}, data('span', {}, c.header), el('span', { class: 'num' },
        F.plural(es.length, 'cell') + (m ? ', ' + m + ' above max' : ''))),
      el('ul', { class: 'cell-lines' }, ...es.map((e) => el('li', {}, cellLine(e)))));
  });
  const save = autofocused(button('Save ' + F.plural(n, 'cell'), () => { d.close(); doSave(false); }));
  const d = dialog('Save ' + F.plural(n, 'cell') + '?', ...groups,
    over ? el('p', { class: 'warn' }, over === 1 ? '1 is above max; it will be saved as typed.'
      : over + ' are above max; they will be saved as typed.') : null,
    gone.length ? el('div', { class: 'gone' },
      el('p', {}, gone.length + " can't be saved: student or column not in this course."),
      el('ul', { class: 'cell-lines' }, ...gone.map((e) => el('li', {}, e.student_id + ' ' + e.column + ': ' +
        shown(e.original) + ' → ' + shown(e.value)))),
      button('Drop these ' + gone.length, () => { d.close(); dropGone(); renderColumn(); }, 'btn outline')) : null,
    el('div', { class: 'sheet-actions' }, button('Discard all…', () => { d.close(); openDiscard(); }, 'btn outline'),
      save),
    el('div', { class: 'sheet-actions' }, button('Keep editing', () => d.close(), 'btn outline')));
}

// `{id} {name}: {was} → {new}`
function cellLine(e) {
  const row = state.byId.get(e.student_id);
  return el('span', {}, el('span', { class: 'id' }, e.student_id), ' ', row ? data('span', {}, row.name) : null,
    ': ' + shown(e.original) + ' → ' + shown(e.value));
}

// Saves every unsaved edit; `after` runs when none is left (Save and leave). A Retry resends the same edits.
function doSave(retrying, after) {
  if (state.saving || !state.edits.size) return;
  const n = state.edits.size;
  cm.working = 'Saving ' + F.plural(n, 'cell') + '…';
  cm.alert.replaceChildren();
  saveEdits().then((reply) => {
    renderColumn();
    if (!reply.ok) return saveRefused(reply, n, after);
    const listed = reply.conflicts.filter((c) => c.reason !== 'not found');
    const nothing = !retrying && !reply.batch && !reply.saved.length && !reply.conflicts.length;
    const text = nothing ? 'Nothing to save: Drive already has these values'
      : F.saveResult(reply, state.open.course.columns);
    if (reply.conflicts.length) {
      alertBox(text, listed.length > 3 ? button('Show all', () => openConflicts(listed), 'btn outline') : null);
    } else {
      say(text);
    }
    if (after && !state.edits.size) after();
  }, (err) => {
    refreshChrome();
    const kind = failureKind(err);
    if (kind === 'auth') {
      return alertBox('Signed out of Google. Sign in again; your edits are kept.',
        button('Sign in', () => location.reload(), 'btn outline'));
    }
    alertBox((kind === 'offline' ? "Save failed: you're offline. " : "Save failed: Google didn't finish the save. ") +
      kept(n), button('Retry', () => doSave(true, after), 'btn outline'));
  });
  refreshChrome();
}

function kept(n) {
  return 'Your ' + F.plural(n, 'edit') + (n === 1 ? ' is' : ' are') + ' kept.';
}

function saveRefused(reply, n, after) {
  if (reply.code === 'BUSY') {
    return alertBox('Another save is running; try again. ' + kept(n),
      button('Retry', () => doSave(true, after), 'btn outline'));
  }
  if (reply.code === 'UNAVAILABLE' || reply.code === 'NOT_FOUND') {
    return alertBox('Not saved: ' + reply.message + ' Your ' + F.plural(n, 'edit') + (n === 1 ? ' is' : ' are') +
      ' kept on this device.', button('Back to courses', backToCourses, 'btn outline'));
  }
  alertBox("Save failed: Google didn't finish the save. " + kept(n),
    button('Retry', () => doSave(true, after), 'btn outline'));
}

function openConflicts(conflicts) {
  const d = dialog('Changed elsewhere, not saved (' + conflicts.length + ')',
    el('ul', { class: 'conf-list' }, ...conflicts.map((c) => {
      const row = state.byId.get(c.student_id);
      const e = state.edits.get(editKey(c.student_id, c.column));
      const mine = e ? e.value : '';
      const line = c.reason === 'invalid'
        ? "Drive refused '" + mine + "' for " + c.student_id + ' ' + c.column + ': not a valid score.'
        : c.column + '   Drive now ' + shown(c.now) + ' · yours ' + shown(mine);
      return el('li', {},
        el('p', {}, el('span', { class: 'id' }, c.student_id), ' ', row ? data('span', {}, row.name) : null),
        el('div', { class: 'conf-line' }, el('span', {}, line),
          button('Go to', () => { d.close(); goTo(c.student_id, c.column); }, 'btn outline')));
    })),
    el('p', { class: 'muted' }, 'These stay unsaved. Save again to write your values, or change them first.'),
    el('div', { class: 'sheet-actions' }, button('Close', () => d.close(), 'btn outline')));
}

// Opens the column with the student's row focused.
function goTo(sid, column) {
  if (state.search) {
    state.search = '';
    cm.search.value = '';
  }
  choose(column);
  const it = cm.items.find((x) => x.row.student_id === sid);
  if (!it) return;
  reveal(it.li);
  if (it.value.tagName === 'INPUT') it.value.focus({ preventScroll: true });
}

function backToCourses() {
  closeCourse();
  showCourses();
}

// ---- 10. Discard (S8.10) ----
function openDiscard() {
  const n = state.edits.size;
  if (!n || state.saving) return;
  const d = dialog('Discard ' + F.plural(n, 'unsaved edit') + '?',
    el('p', {}, "They were never saved to Drive and can't be brought back."),
    el('div', { class: 'sheet-actions' }, autofocused(button('Keep edits', () => d.close(), 'btn outline')),
      button('Discard ' + F.plural(n, 'edit'), () => {
        d.close();
        discardEdits();
        if (cm.banner) cm.banner.remove();
        renderColumn();
        say('Discarded ' + F.plural(n, 'edit'));
      }, 'btn danger')));
}

// ---- 11. Undo last save (S9) ----
function openUndo() {
  const t = state.open.journal.undo;
  if (!t || state.edits.size || state.saving) return;
  const lines = t.edits.map((e) => {
    const row = state.byId.get(e.student_id);
    return el('li', {}, el('span', { class: 'id' }, e.student_id), ' ', row ? data('span', {}, row.name) : null,
      ' ' + e.column + ': ' + shown(e.value) + ' → ' + shown(e.original));
  });
  if (t.cells > t.edits.length) lines.push(el('li', { class: 'muted' }, 'and ' + (t.cells - t.edits.length) + ' more'));
  const d = dialog(F.undoTitle(t, state.now), el('ul', { class: 'cell-lines' }, ...lines),
    el('p', {}, 'Drive gets the earlier values back. Cells changed since then are left alone.'),
    el('div', { class: 'sheet-actions' }, autofocused(button('Cancel', () => d.close(), 'btn outline')),
      button('Undo save', () => { d.close(); doUndo(t); })));
}

function doUndo(t) {
  cm.working = 'Undoing save of ' + F.fmtTime(t.ts, state.now) + '…';
  cm.alert.replaceChildren();
  undoLastSave(t.batch).then((reply) => {
    renderColumn();
    if (reply.ok) {
      const text = F.undoResult(reply, t, state.now);
      return reply.conflicts.length ? alertBox(text) : say(text);
    }
    if (reply.code === 'UNDO_CHANGED') {
      return alertBox('Another device saved since this page loaded. Reload to see the newest save, then try again.',
        button('Reload', reload, 'btn outline'));
    }
    if (reply.code === 'UNAVAILABLE' || reply.code === 'NOT_FOUND') {
      return alertBox('Not saved: ' + reply.message, button('Back to courses', backToCourses, 'btn outline'));
    }
    if (reply.code === 'BUSY') {
      return alertBox('Another save is running; try again.', button('Retry', () => doUndo(t), 'btn outline'));
    }
    alertBox(String(reply.message).replace(/`/g, ''));
  }, (err) => {
    refreshChrome();
    alertBox(failureKind(err) === 'offline' ? "You're offline. Connect, then try again."
      : "Google didn't answer. Try again in a moment.");
  });
  refreshChrome();
}

// ---- 12. Leaving with unsaved edits (S8.7) ----
function leave(then) {
  const n = state.edits.size;
  const go = () => { closeCourse(); then(); };
  if (!n) return go();
  if (state.saving) return;
  const d = dialog(el('span', {}, F.plural(n, 'unsaved edit') + ' in ', data('span', {}, state.open.course.course_name)),
    el('p', {}, 'They stay on this device as a draft if you leave without saving.'),
    el('div', { class: 'sheet-actions' }, autofocused(button('Keep editing', () => d.close(), 'btn outline'))),
    el('div', { class: 'sheet-actions' }, button('Leave, keep draft', () => { d.close(); go(); }, 'btn outline'),
      button('Save and leave', () => { d.close(); doSave(false, go); })));
}

// ---- More sheet ----
function openMore() {
  const j = state.open.journal;
  const n = state.edits.size;
  const item = (label, sub, onclick, disabled) => {
    const b = el('button', { type: 'button', class: 'menu-item', onclick }, el('span', {}, label),
      sub ? el('span', { class: 'muted' }, sub) : null);
    b.disabled = disabled;
    return b;
  };
  const undoSub = n ? 'Save or discard your ' + F.plural(n, 'unsaved edit') + ' first'
    : j.undo ? F.fmtTime(j.undo.ts, state.now) + ' · ' + F.plural(j.undo.cells, 'cell')
      : String(j.undo_note).replace(/`/g, '');
  const title = j.unpulled
    ? el('span', {}, 'Drive: ' + F.plural(j.unpulled, 'edit') + ' not pulled', el('br'),
      el('span', { class: 'muted' }, 'last saved ' + F.fmtTime(j.last_saved, state.now)))
    : 'Drive: no edits waiting to be pulled';
  const d = dialog(title,
    item('Undo last save', undoSub, () => { d.close(); openUndo(); }, !!n || !j.undo || state.saving),
    item(n ? 'Discard all unsaved edits (' + n + ')' : 'Discard all unsaved edits', n ? null : 'No unsaved edits',
      () => { d.close(); openDiscard(); }, !n || state.saving),
    item('Reload from Drive', null, () => { d.close(); reload(); }, state.saving),
    item('Switch course', null, () => { d.close(); leave(showCourses); }, state.saving),
    el('div', { class: 'sheet-actions' }, autofocused(button('Close', () => d.close(), 'btn outline'))));
}

// Reload from Drive: unsaved edits stay on top (they are conflict-checked on Save).
function reload() {
  const n = state.edits.size;
  reloadCourse().then((reply) => {
    if (!reply.ok) {
      return alertBox(reply.code === 'BUSY' ? 'Drive is busy with a save from another device. Try again in a moment.'
        : reply.message, button('Back to courses', backToCourses, 'btn outline'));
    }
    show(...courseView(null));
    say(n ? 'Reloaded. Your ' + F.plural(n, 'unsaved edit') + (n === 1 ? ' is' : ' are') + ' kept.' : 'Reloaded');
  }, (err) => {
    alertBox(failureKind(err) === 'offline' ? "You're offline. Connect, then try again."
      : "Google didn't answer. Try again in a moment.");
  });
}

// Search filters the rows only; unsaved edits and the column stay (S3.8, edge 46).
function applySearch() {
  cm.clear.hidden = state.search === '';
  let shown = 0;
  for (const it of cm.items) {
    it.li.hidden = !matches(it.row, state.search);
    if (!it.li.hidden) shown += 1;
  }
  if (!currentColumn()) {
    cm.empty.replaceChildren(el('p', {}, 'Pick a column to enter scores.'));
  } else if (shown === 0) {
    cm.empty.replaceChildren(data('p', {}, 'No students match "' + state.search.trim() + '".'),
      button('Clear search', clearSearch, 'btn outline'));
  } else {
    cm.empty.replaceChildren();
  }
}

function clearSearch() {
  state.search = '';
  cm.search.value = '';
  applySearch();
  cm.search.focus();
}

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', placeBar);
  window.visualViewport.addEventListener('scroll', placeBar);
}
// Ctrl/Cmd+S opens the Save sheet; leaving the focused input commits it first.
document.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 's' || !state.open || !cm) return;
  e.preventDefault();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  openSaveSheet();
});
// `/` focuses Search anywhere in a course (Interface "Keyboard").
document.addEventListener('keydown', (e) => {
  if (e.key !== '/' || !cm || !cm.search.isConnected) return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  e.preventDefault();
  cm.search.focus();
});

showCourses();
</script>
