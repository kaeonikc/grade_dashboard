<script>
'use strict';
// Screens (web/SPEC.md "Interface"): the course list, opening a course, column mode, attendance, the student detail,
// the wide table, the Grading tab, and the Fill, Save, Discard, Undo, Leave and More dialogs.
// Every piece of course data goes in as text (textContent), never as HTML.

const SLOW_MS = 8000;
const THAI = /[฀-๿]/;
const app = document.getElementById('app');
const F = Journal.fmt;
const WIDE = window.matchMedia('(min-width: 960px)');

// A DOM element. Children are nodes or text; `onclick` is the one event attribute.
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'onclick') node.addEventListener('click', v); else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null && c !== false) node.append(c instanceof Node ? c : String(c));
  return node;
}

// Data shown verbatim (names, course names, headers); Thai is marked so VoiceOver reads it in Thai.
function data(tag, attrs, text) {
  return el(tag, Object.assign(THAI.test(text) ? { lang: 'th' } : {}, attrs), text);
}

function button(label, onclick, cls) {
  return el('button', { type: 'button', class: cls || 'btn', onclick }, label);
}

// Replaces the screen (an open detail and table go with it) and moves focus to its heading.
function show(...nodes) {
  det = null;
  tb = null;
  document.body.classList.remove('view-table');
  app.replaceChildren(...nodes);
  window.scrollTo(0, 0);
  const h = app.querySelector('h1');
  if (h) { h.setAttribute('tabindex', '-1'); h.focus(); }
}

// ---- ?timing=1 (SPEC_discard_and_speed.md D2): times and Drive counts only, never course data ----
const TIMING_LABELS = { listCourses: 'list', loadCourse: 'load', saveBatch: 'save', undoLastSave: 'undo',
  saveConfig: 'config' };
const timingLine = TIMING ? el('p', { class: 'timing', 'aria-hidden': 'true' }) : null;

function secs(ms) {
  return (ms / 1000).toFixed(2) + ' s';
}

// `page 0.90 s (doGet 0.12 s) · list 2.80 s (server 1.60 s, lock 0.00 s, Drive 26 list / 12 read, cache 0/0) · …`
function refreshTiming() {
  if (!timingLine) return;
  const parts = state.pageMs == null ? [] :
    ['page ' + secs(state.pageMs) + (DOGET_MS == null ? '' : ' (doGet ' + secs(DOGET_MS) + ')')];
  for (const [name, t] of Object.entries(state.timing)) {
    const v = t.server;
    parts.push((TIMING_LABELS[name] || name) + ' ' + secs(t.total) + (v ? ' (server ' + secs(v.ms) + ', lock ' +
      secs(v.lock_ms) + ', Drive ' + v.list + ' list / ' + v.read + ' read, cache ' + v.hit + '/' + (v.hit + v.miss) +
      ')' : ''));
  }
  timingLine.textContent = parts.join(' · ');
}
document.addEventListener('gw:timing', refreshTiming);

function notice(title, body, ...buttons) {
  return el('section', { class: 'notice' }, el('p', { class: 'notice-title' }, title),
    body ? el('p', { class: 'muted' }, body) : null, el('div', { class: 'actions' }, ...buttons));
}

// ---- 2. Course list (S2.1, S2.3) ----
function listHeader() {
  return el('header', { class: 'page-head' }, el('h1', {}, 'grade_web'),
    el('p', { class: 'muted' }, 'Courses on Drive'), timingLine);
}

// The list this device saw last shows at once (D6) and Drive's list replaces it; then the course opened last is
// prefetched (D8). A reply that comes after a course was tapped changes nothing on screen.
function showCourses() {
  const cached = courseListCache();
  const status = el('p', { class: 'muted' });
  let head = listHeader();
  if (cached) {
    // until Drive answers, the device clock stands in for the server's (state.now)
    if (!state.now) {
      state.now = cached.saved_at;
      state.nowAt = Date.parse(cached.saved_at);
      state.now = serverNow();
      state.nowAt = Date.now();
    }
    status.textContent = 'Checking Drive…';
    show(head, status, courseList(cached.courses));
  } else {
    show(head, el('div', { class: 'card placeholder', 'aria-hidden': 'true' }),
      el('div', { class: 'card placeholder', 'aria-hidden': 'true' }), el('p', { class: 'muted' }, 'Loading courses…'));
  }
  if (state.pageMs == null) {
    state.pageMs = performance.now();
    refreshTiming();
  }
  const here = () => head.isConnected;
  const replace = (...nodes) => {
    const y = window.scrollY;
    head = listHeader();
    show(head, ...nodes);
    if (cached) window.scrollTo(0, y);
  };
  loadCourses().then((reply) => {
    if (!here()) return;
    if (reply.ok && reply.courses.length) {
      replace(courseList(reply.courses));
      const last = lastCourse();
      if (reply.courses.some((c) => c.available && c.folder === last)) prefetch(last);
      return;
    }
    if (reply.ok || reply.code === 'NOT_FOUND') {
      return replace(notice('No pushed courses yet.', 'On the Mac, run grader web-push <course>, wait ' +
        'for Drive to finish uploading, then reload this page.', button('Reload', showCourses)));
    }
    if (cached) {
      return status.replaceChildren('Drive is busy with a save from another device. ',
        button('Try again', showCourses, 'btn outline'));
    }
    replace(notice('Drive is busy with a save from another device.', null, button('Try again', showCourses)));
  }, () => {
    if (!here()) return;
    if (cached) {
      return status.replaceChildren("Couldn't refresh (list from " + F.fmtTime(cached.saved_at, state.now) + '). ',
        button('Try again', showCourses, 'btn outline'));
    }
    replace(notice("Couldn't load the course list.", 'Check your connection, then try again.',
      button('Try again', showCourses)));
  });
}

function courseList(courses) {
  const names = courses.filter((c) => c.available).map((c) => c.course_name);
  const shared = (name) => names.indexOf(name) !== names.lastIndexOf(name);
  return el('ul', { class: 'courses' }, ...courses.map((c) => el('li', {}, c.available
    ? courseCard(c, shared(c.course_name))
    : el('div', { class: 'card unavailable' },
      el('p', { class: 'card-title' }, '⚠ ', data('span', {}, c.folder), ' ',
        el('span', { class: 'tag' }, 'Unavailable')),
      el('p', {}, c.reason)))));
}

function courseCard(c, showFolder) {
  const drafts = draftCount(c.folder);
  return el('button', { type: 'button', class: 'card course', onclick: () => showCourse(c.folder, c.course_name) },
    data('span', { class: 'card-title' }, c.course_name),
    showFolder ? data('span', { class: 'muted' }, c.folder) : null,
    el('span', {}, c.course_id + ' · ' + c.term),
    el('span', {}, 'Pushed ' + F.fmtTime(c.pushed_at, state.now)),
    el('span', {}, F.journalLine(c, state.now)),
    c.older_push ? el('span', { class: 'warn' }, "Some of these edits were saved while the latest push was " +
      "syncing. They're kept; pull them on the Mac: grader web-pull") : null,
    drafts ? el('span', { class: 'unsaved' }, '● ' + drafts + ' unsaved on this device') : null,
    el('span', { class: 'chevron', 'aria-hidden': 'true' }, '›'));
}

// ---- 3. Opening a course ----
// A course this tab has in memory opens with no wait (D7); an older copy is then rechecked.
function showCourse(folder, courseName) {
  const back = button('Back to courses', showCourses);
  const slow = el('p', { class: 'muted' });
  let timer = null;
  if (!state.loaded.has(folder) || state.fetching.has(folder)) {
    show(el('section', { class: 'opening' }, data('h1', {}, courseName),
      el('div', { class: 'spinner', 'aria-hidden': 'true' }),
      el('p', {}, 'Opening ', data('span', {}, courseName), '…'),
      el('p', { class: 'muted' }, 'Reading the course from Drive'), slow));
    timer = setTimeout(() => {
      slow.textContent = 'Still working. Large courses take a little longer.';
    }, SLOW_MS);
  }
  const failed = (cause) => show(listHeader(),
    notice(el('span', {}, "Couldn't open ", data('span', {}, courseName), '.'), cause,
      button('Try again', () => showCourse(folder, courseName)), back));
  openCourse(folder).then(({ reply, draft, stale }) => {
    clearTimeout(timer);
    if (reply.ok) {
      // The tab and category used last on this device (openCourse); the ☰ menu starts shown on wide screens only.
      state.menu = WIDE.matches && menuPref();
      show(...courseView(draft));
      renderView();
      if (stale) recheck();
      return;
    }
    if (reply.code === 'BUSY') return failed('Drive is busy with a save from another device. Try again in a moment.');
    show(listHeader(), notice(el('span', {}, "Can't open ", data('span', {}, courseName), '.'), reply.message, back));
  }, () => {
    clearTimeout(timer);
    failed(navigator.onLine === false ? "You're offline. Connect, then try again." :
      "Google didn't answer. Try again in a moment.");
  });
}

// A course opened from memory and older than FRESH_MS: locked, with `Checking Drive…`, until Drive's copy replaces
// it (D7). The open detail, the scroll position and a draft banner still shown are kept.
function recheck() {
  const folder = state.open.folder;
  cm.alert.replaceChildren();
  refreshChrome();
  const again = () => button('Try again', recheck, 'btn outline');
  recheckCourse().then(({ reply, draft }) => {
    if (!state.open || state.open.folder !== folder) return;
    if (reply.ok) {
      const y = window.scrollY;
      const student = det && det.row.student_id;
      show(...courseView(cm.banner && cm.banner.isConnected ? draft : null));
      renderView();
      if (student && state.byId.has(student)) openDetail(state.byId.get(student));
      window.scrollTo(0, y);
      return;
    }
    if (reply.code === 'BUSY') return alertBox("Couldn't check Drive: it's busy with a save from another device.", again());
    const name = state.open.course.course_name;
    closeCourse();
    state.loaded.delete(folder);
    show(listHeader(), notice(el('span', {}, "Can't open ", data('span', {}, name), '.'), reply.message,
      button('Back to courses', showCourses)));
  }, (err) => {
    if (!state.open || state.open.folder !== folder) return;
    alertBox(failureKind(err) === 'offline' ? "Couldn't check Drive: you're offline." : "Couldn't check Drive.", again());
  });
}

// ---- 4. Scores: column mode (S3) ----
const STATUS_MS = 4000;
let cm = null;  // the open column mode: its controls, one item per student row, and the focused item

// draft: openCourse's restoreDraft result, shown as the draft banner (null: none).
function courseView(draft) {
  const o = state.open;
  cm = { items: [], current: null, statusTimer: null, working: null };
  cm.badge = el('button', { type: 'button', class: 'badge unsaved', hidden: '', onclick: openSaveSheet });
  cm.headLine = el('p', { class: 'muted' });
  cm.strip = storageStrip();
  cm.menuBtn = el('button', { type: 'button', class: 'icon menu-btn', 'aria-label': 'Categories',
    'aria-controls': 'cat-menu', 'aria-expanded': 'false', onclick: () => toggleMenu() }, '☰');
  const head = el('header', { class: 'course-head' },
    el('div', { class: 'course-bar' }, cm.menuBtn,
      el('button', { type: 'button', class: 'icon', 'aria-label': 'Courses', onclick: () => leave(showCourses) }, '‹'),
      data('h1', { class: 'course-name' }, o.course.course_name), cm.badge,
      el('button', { type: 'button', class: 'icon', 'aria-label': 'More', 'aria-haspopup': 'dialog', onclick: openMore },
        '⋯')),
    cm.headLine, cm.strip, timingLine);

  cm.select = el('select', { id: 'col', class: 'col-select' });
  cm.select.addEventListener('change', () => choose(cm.select.value));
  cm.prev = el('button', { type: 'button', class: 'icon', 'aria-label': 'Previous column', onclick: () => step(-1) },
    '‹');
  cm.next = el('button', { type: 'button', class: 'icon', 'aria-label': 'Next column', onclick: () => step(1) }, '›');
  cm.line = el('p', { class: 'muted col-line' });
  cm.search = el('input', { type: 'text', id: 'search', class: 'search-input', placeholder: 'Search ID or name',
    'aria-label': 'Search students', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
  cm.search.value = state.search;
  cm.search.addEventListener('input', () => { state.search = cm.search.value; applySearch(); });
  cm.clear = el('button', { type: 'button', class: 'icon search-clear', 'aria-label': 'Clear search',
    onclick: clearSearch }, '×');
  cm.fill = button('Fill…', openFill, 'btn outline fill-btn');
  cm.label = el('label', { for: 'col' });
  cm.gridBack = button('‹ Grid', () => { state.attSession = false; renderView(); }, 'btn outline grid-back');
  const picker = el('section', { class: 'col-picker' }, cm.label,
    el('div', { class: 'col-row' }, cm.gridBack, cm.prev, cm.select, cm.next), cm.line,
    el('div', { class: 'search-row' }, el('div', { class: 'search' }, cm.search, cm.clear), cm.fill));

  // grade-tui's tabs (SPEC_web_tabs.md): a strip on wide screens, the bottom tab bar on phones (CSS shows one).
  cm.views = el('nav', { class: 'views', 'aria-label': 'Tabs' },
    ...TAB_LABELS.map(([tab, label], i) => tabButton(tab, '[' + (i + 1) + '] ' + label, 'btn outline view-btn')));
  cm.tabs = el('nav', { class: 'tabs', 'aria-label': 'Tabs' },
    ...TAB_LABELS.map(([tab, label, short]) => tabButton(tab, short || label, 'tab')));
  cm.menuList = el('ul', { class: 'menu-list' });
  cm.menu = el('nav', { id: 'cat-menu', class: 'cat-menu', 'aria-label': 'Categories' },
    el('p', { class: 'menu-title' }, 'Categories'), cm.menuList);
  cm.menu.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !WIDE.matches) closeDrawer(); });
  cm.scrim = el('div', { class: 'scrim', 'aria-hidden': 'true', onclick: () => closeDrawer() });
  // The attendance grid's toolbar (SPEC_attendance_grid.md A1, A11)
  cm.takeToday = button('Take today ›', () => { const t = todaySession(); if (t) openSession(t); }, 'btn outline');
  cm.riskBtn = button('At risk only', () => {
    state.attRisk = !state.attRisk;
    refreshAttBar();
    if (tb) searchTable();
  }, 'btn outline toggle');
  cm.sortBtn = button('', () => {
    state.attSort = !state.attSort;
    refreshAttBar();
    renderTable();
  }, 'btn outline toggle');
  cm.attBar = el('div', { class: 'att-bar', role: 'group', 'aria-label': 'Attendance grid' }, cm.takeToday,
    cm.riskBtn, cm.sortBtn);
  cm.summary = el('div', { class: 'summary' });
  cm.overview = el('div', { class: 'overview' });
  cm.wrap = el('div', { class: 'table-wrap' });
  cm.grading = el('div', { class: 'grading' });
  cm.list = el('ul', { class: 'rows' });
  cm.list.addEventListener('keydown', attendanceKey);
  cm.empty = el('div', { class: 'empty' });
  cm.nextBtn = el('button', { type: 'button', class: 'btn kbar-next', onclick: () => move(1) }, 'Next ↓');
  cm.bar = el('div', { class: 'kbar', hidden: '' },
    el('button', { type: 'button', class: 'btn outline', lang: 'th', onclick: () => barSet('ขส', true) }, 'ขส'),
    el('button', { type: 'button', class: 'btn outline', onclick: () => barSet('', false) }, 'Clear'),
    cm.nextBtn);
  // Keep the input focused so the keypad stays open (iOS): the buttons act on the focused student.
  cm.bar.addEventListener('pointerdown', (e) => e.preventDefault());
  cm.status = el('p', { class: 'status', role: 'status' });
  cm.alert = el('div', { class: 'alert', role: 'alert' });
  cm.saveBtn = button('', openSaveSheet, 'btn save-btn');
  // Discard sits left of Save wherever Save shows (SPEC_discard_and_speed.md D1)
  cm.discardBtn = button('Discard', () => openDiscard(true), 'btn outline discard-btn');
  cm.dock = el('div', { class: 'dock' }, cm.alert, cm.status,
    el('div', { class: 'action-bar' }, cm.discardBtn, cm.saveBtn), cm.tabs);
  cm.announce = el('p', { class: 'sr-only', 'aria-live': 'polite' });
  cm.banner = draftBanner(draft);
  return [head, cm.banner, cm.views, picker, cm.attBar, cm.list, cm.empty, cm.summary, cm.overview, cm.wrap, cm.grading,
    cm.announce, cm.dock, cm.bar, cm.scrim, cm.menu].filter(Boolean);
}

const TAB_LABELS = [['summary', 'Summary'], ['raw', 'Raw Details', 'Raw'], ['analytics', 'Analytics'],
  ['grading', 'Grading']];

function tabButton(tab, label, cls) {
  const b = button(label, () => setTab(tab), cls);
  b.dataset.tab = tab;
  return b;
}

// What renders for the tab and category: Raw Details is the table on wide screens and column mode (Scores, or
// Attendance for the attendance category) on phones. All columns ('*') is wide only.
// Attendance is the grid (the table, both widths) until a session is opened (SPEC_attendance_grid.md A1).
function modeOf() {
  if (state.tab !== 'raw') return state.tab;
  if (state.category === 'attendance') return state.attSession ? 'attendance' : 'table';
  return WIDE.matches ? 'table' : 'scores';
}

// A category always opens on one of its columns: the picked one when it belongs there, else its first.
function normalizeNav() {
  const course = state.open.course;
  if (state.category === '*' ? !WIDE.matches : !Grades.navCategories(course).includes(state.category)) {
    state.category = Grades.firstCategory(course);
  }
  const cols = Grades.columnsOf(course, state.category);
  if (state.category !== '*' && state.category !== 'attendance' && cols.length &&
      !cols.some((c) => c.name === state.column)) {
    state.column = cols[0].name;
  }
}

// The current tab and category, from the current state; an open detail is rebuilt with fresh values.
function renderView() {
  normalizeNav();
  const v = state.view = modeOf();
  const wideSummary = v === 'summary' && WIDE.matches;
  const grid = v === 'table' && state.category === 'attendance';
  document.body.classList.toggle('view-table', v === 'table' || wideSummary);
  document.body.classList.toggle('view-attgrid', grid);
  cm.attBar.hidden = !grid;
  cm.gridBack.hidden = v !== 'attendance';
  if (grid) refreshAttBar();
  for (const k of ['grading', 'summary', 'analytics']) document.body.classList.toggle('view-' + k, v === k);
  for (const b of [...cm.views.children, ...cm.tabs.children]) {
    b.setAttribute('aria-pressed', String(b.dataset.tab === state.tab));
  }
  if (v !== 'table') tb = null;
  if (v !== 'table' && !wideSummary) cm.wrap.replaceChildren();
  if (v !== 'grading') {
    cfg = null;
    cm.grading.replaceChildren();
  }
  if (v !== 'scores' && v !== 'attendance') {
    cm.items = [];
    cm.list.replaceChildren();
    cm.empty.replaceChildren();
    keypad(false);
  }
  if (v !== 'summary') sm = null;
  cm.summary.replaceChildren();
  cm.overview.replaceChildren();
  renderMenu();
  if (v === 'grading') {
    renderGrading();
    refreshChrome();
  } else if (v === 'table') {
    renderTable();
    refreshCounts();
  } else if (v === 'summary') {
    renderSummary();
    refreshChrome();
  } else if (v === 'analytics') {
    renderOverview();
    refreshChrome();
  } else {
    renderColumn();
  }
  if (det) renderDetail();
}

function setTab(tab) {
  if (!Grades.TABS.includes(tab)) return;
  state.tab = tab;
  state.attSession = false;
  rememberUi();
  renderView();
}

function setCategory(category) {
  state.tab = 'raw';
  state.category = category;
  state.attSession = false;
  normalizeNav();
  rememberUi();
  renderView();
}

// Storage refused (S8.8, edge 40): one line under the header on every course screen; a tap shows why.
function storageStrip() {
  const more = el('span', { hidden: '' },
    ' Storage is blocked here (for example in a private window). Saved edits on Drive are safe.');
  const strip = el('button', { type: 'button', class: 'strip', 'aria-expanded': 'false', hidden: '' },
    "Unsaved edits can't be backed up in this browser. Save often: closing this tab loses them.", more);
  strip.addEventListener('click', () => {
    more.hidden = !more.hidden;
    strip.setAttribute('aria-expanded', String(!more.hidden));
  });
  return strip;
}

// Draft found on opening (S8.4, edge 38). Dismissing keeps the edits.
function draftBanner(draft) {
  if (!draft) return null;
  const box = el('section', { class: 'banner', 'aria-label': 'Draft' });
  const dismiss = el('button', { type: 'button', class: 'icon dismiss', 'aria-label': 'Dismiss',
    onclick: () => box.remove() }, '×');
  if (draft.already) {
    box.append(el('p', {}, 'Your draft from ' + F.fmtTime(draft.made_at, state.now) +
      ' is already on Drive; nothing to restore.'), dismiss);
    return box;
  }
  box.append(
    el('p', { class: 'notice-title' }, F.plural(draft.count, 'unsaved edit') + ' restored (' +
      F.draftAge(draft.made_at, state.now) + ')'),
    el('div', {}, draft.pushed ? el('p', {}, 'The course was pushed again since then; each edit is checked when you ' +
      'save.') : null, draft.gone ? el('p', {}, (draft.gone === 1 ? '1 is for a student or column'
      : draft.gone + ' are for students or columns') + ' no longer in this course.') : null),
    el('div', { class: 'actions' }, button('Review', openSaveSheet, 'btn outline'),
      button('Discard…', () => openDiscard(), 'btn outline')), dismiss);
  return box;
}

// Scores: the current category's columns (total columns are never listed). Attendance: the sessions verbatim,
// today's marked `· today`.
function renderPicker() {
  const course = state.open.course;
  const att = state.view === 'attendance';
  cm.label.textContent = att ? 'Session' : 'Column';
  cm.prev.setAttribute('aria-label', att ? 'Previous session' : 'Previous column');
  cm.next.setAttribute('aria-label', att ? 'Next session' : 'Next column');
  const opts = [el('option', { value: '', disabled: '' }, att ? 'Pick a session' : 'Pick a column')];
  if (att) {
    const today = todaySession();
    opts.push(...sessions().map((c) => data('option', { value: c.name }, c.header + (c.name === today ? ' · today' : ''))));
  } else {
    const cols = Grades.columnsOf(course, state.category);
    if (cols.length) opts.push(el('optgroup', { label: state.category }, ...cols.map((c) => optionFor(c))));
  }
  cm.select.replaceChildren(...opts);
  const col = currentColumn();
  cm.select.value = col ? col.name : '';
  const cols = viewColumns();
  const i = cols.indexOf(col);
  cm.prev.disabled = i <= 0;
  cm.next.disabled = i < 0 || i >= cols.length - 1;
}

function optionFor(c) {
  return data('option', { value: c.name }, c.header + ' · ' + enteredCount(c.name) + '/' + state.rows.length);
}

// The columns ‹ › step through: the sessions on Attendance, the category's columns on Scores.
function viewColumns() {
  const att = state.view === 'attendance';
  if (att) return sessions();
  return Grades.columnsOf(state.open.course, state.category).filter((c) => c.category !== 'attendance');
}

// The column of the current view: the session on Attendance, else the picked column of the category (the table:
// any picked column it shows, for Fill).
function currentColumn() {
  const att = state.view === 'attendance';
  const col = state.open.course.columns.find((c) => c.name === (att ? state.session : state.column));
  if (!col || att) return col;
  if (state.view === 'table') return state.category === '*' || col.category === state.category ? col : undefined;
  return col.category !== 'attendance' && col.category === state.category ? col : undefined;
}

// A column picked anywhere opens Raw Details on its category (a session: Attendance) with it.
function choose(name) {
  const col = state.open.course.columns.find((c) => c.name === name);
  if (!col) return;
  const att = col.category === 'attendance';
  if (att) state.session = name; else pickColumn(name);
  if (state.tab !== 'raw' || (state.category !== col.category && state.category !== '*')) {
    return setCategory(col.category);
  }
  if (state.view === 'table') return renderView();
  renderColumn();
}

function step(delta) {
  const cols = viewColumns();
  const i = cols.indexOf(currentColumn()) + delta;
  if (i >= 0 && i < cols.length) choose(cols[i].name);
}

function renderColumn() {
  renderPicker();
  cm.current = null;
  keypad(false);
  const col = currentColumn();
  cm.items = col ? state.rows.map((row, i) => rowItem(row, col, i)) : [];
  for (const it of cm.items) it.list = cm.items;
  cm.list.replaceChildren(...cm.items.map((it) => it.li));
  refreshCounts();
  applySearch();
}

// One student: ID, name and sub-line on the left (the button that opens the detail), the value on the right (an
// input for a score column).
function rowItem(row, col, i) {
  const it = { row, col, sub: el('p', { class: 'sub', id: 'sub-' + i }) };
  it.msg = el('p', { class: 'msg', id: 'msg-' + i, role: 'alert' });
  it.who = el('button', { type: 'button', class: 'who', onclick: () => openDetail(row) },
    el('span', { class: 'id' }, row.student_id), data('span', { class: 'name' }, row.name), it.sub,
    el('span', { class: 'chevron', 'aria-hidden': 'true' }, '›'));
  it.who.setAttribute('aria-label', 'Open ' + row.name + ' ' + row.student_id);
  // A session (Attendance tab): the code as written on line 1, the code buttons on line 2.
  const att = col.category === 'attendance';
  if (att) it.value = el('span', { class: 'code' }); else scoreInput(it);
  it.li = el('li', { class: att ? 'row att' : 'row' }, it.who,
    el('div', { class: 'cell' }, it.value, el('span', { class: 'mark', 'aria-hidden': 'true' }, '*')),
    att ? codeButtons(it) : null, it.msg);
  refreshItem(it);
  return it;
}

function scoreInput(it) {
  it.value = el('input', { type: 'text', inputmode: 'decimal', enterkeyhint: 'next', autocomplete: 'off',
    autocorrect: 'off', spellcheck: 'false', class: 'score', 'aria-describedby': it.sub.id + ' ' + it.msg.id });
  it.value.setAttribute('aria-label', it.col.header + ' for ' + it.row.name + ' ' + it.row.student_id);
  inputEvents(it);
}

function inputEvents(it) {
  const input = it.value;
  input.addEventListener('focus', () => {
    cm.current = it;
    input.select();
    keypad(true);
    placeBar();
    cm.nextBtn.textContent = nextVisible(it, 1) ? 'Next ↓' : 'Done';
  });
  // The refusal shows live while typing; nothing is committed until Next, Enter, Tab or leaving the field.
  input.addEventListener('input', () => {
    const text = input.value;
    const r = Grades.validateTyped(text);
    refuse(it, Grades.sameCell(text, cellValue(it.row, it.col.name)) || r.ok ? '' : refusalText(text.trim(), r.reason));
    preview(it.row, it.col.name, text);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === 'Tab') {
      e.preventDefault();
      move(e.shiftKey ? -1 : 1);
    } else if (e.key === 'Escape') {
      refreshItem(it);
      refuse(it, '');
      preview(it.row, null);
    }
  });
  input.addEventListener('blur', (e) => {
    if (!cm.bar.contains(e.relatedTarget)) keypad(false);
    // Leaving with refused text puts the previous value back; its message stays until the next commit.
    if (!commit(it)) {
      refreshItem(it);
      it.value.classList.remove('refused');
      preview(it.row, null);
    }
  });
}

// Commits the focused text (Interface "Typing rules"). False when refused: focus and the previous value stay.
function commit(it) {
  const r = commitTyped(it.row, it.col.name, it.value.value);
  if (r.refused) {
    refuse(it, r.refused);
    return false;
  }
  refuse(it, '');
  refreshItem(it);
  if (r.changed) {
    changed(it.row);
    announceCommit(it);
  }
  return true;
}

// After a cell of `row` changed: every view that shows the student, the counts and the badge.
function changed(row) {
  for (const it of cm.items) if (it.row === row) refreshItem(it);
  if (tb && tb.grid) refreshAttGrid();
  else if (tb && tb.byId.has(row.student_id)) paintRow(tb.byId.get(row.student_id));
  if (det && det.row === row) {
    for (const it of det.items) refreshItem(it);
    refreshSummary();
  }
  if (sm) paintSummary(row);
  if (state.view === 'analytics') renderOverview();
  refreshCounts();
}

function refuse(it, message) {
  it.msg.textContent = message;
  it.value.classList.toggle('refused', message !== '');
}

// Next (delta 1) or previous (-1) visible student; past the last one, Done closes the keypad.
function move(delta) {
  const it = cm.current;
  if (!it) return;
  if (!commit(it)) {
    it.value.select();  // the next keystroke replaces the refused text
    return;
  }
  const to = nextVisible(it, delta);
  if (to) {
    to.value.focus({ preventScroll: true });
    reveal(to.li);
  } else if (delta > 0) {
    it.value.blur();
    const col = it.col.name;
    if (it.list === cm.items) say('End of list · ' + enteredCount(col) + ' of ' + state.rows.length + ' entered');
  }
}

// The keypad bar replaces the bottom dock while an input has focus (iOS covers the bottom of the page).
function keypad(open) {
  cm.bar.hidden = !open;
  cm.dock.hidden = open;
  document.body.classList.toggle('typing', open);
}

// ขส moves on to the next student (S3.4); Clear stays.
function barSet(value, thenNext) {
  const it = cm.current;
  if (!it || locked()) return;
  it.value.value = value;
  if (thenNext) move(1);
  else commit(it);
}

// The next input of the same list (column mode: students; detail: this student's items) that is shown.
function nextVisible(it, delta) {
  const list = it.list;
  for (let i = list.indexOf(it) + delta; i >= 0 && i < list.length; i += delta) {
    const to = list[i];
    if (!to.li.hidden && to.value.tagName === 'INPUT' && !to.li.closest('details:not([open])')) return to;
  }
  return null;
}

// Scrolls a row to the middle of the space between the sticky header and the keypad bar. The detail scrolls on
// its own, below its sticky bar and summary card.
function reveal(li) {
  const vv = window.visualViewport;
  const inDetail = det && det.panel.contains(li);
  const top = inDetail ? Math.max(det.card.getBoundingClientRect().bottom, vv ? vv.offsetTop : 0)
    : (vv ? vv.offsetTop : 0) + document.querySelector('.course-head').offsetHeight;
  const bottom = (vv ? vv.offsetTop + vv.height : window.innerHeight) - (cm.bar.hidden ? 0 : cm.bar.offsetHeight);
  const r = li.getBoundingClientRect();
  (inDetail ? det.panel : window).scrollBy(0, r.top + r.height / 2 - (top + bottom) / 2);
}

// Pins the keypad bar just above the on-screen keyboard (visualViewport shrinks while it is open).
function placeBar() {
  if (!cm || !cm.bar.isConnected || cm.bar.hidden) return;
  const vv = window.visualViewport;
  const covered = vv ? window.innerHeight - vv.offsetTop - vv.height : 0;
  cm.bar.style.bottom = Math.max(0, covered) + 'px';
}

function refreshItem(it) {
  const name = it.col.name;
  const value = cellValue(it.row, name);
  const e = edited(it.row, name);
  const over = overMax(value, name);
  const session = it.col.category === 'attendance';
  const invalid = session ? badCode(value) : Grades.classify(value)[0] === 'invalid';
  if (it.value.tagName === 'INPUT') it.value.value = value; else it.value.textContent = value;
  it.li.classList.toggle('is-unsaved', !!e);
  it.value.classList.toggle('over', over);
  it.value.classList.toggle('invalid', invalid);
  const parts = [];
  if (e) parts.push(el('span', {}, 'was ' + (e.original.trim() === '' ? 'blank' : e.original)));
  if (over) parts.push(el('span', { class: 'bad' }, 'above max ' + fmtMax(name)));
  if (invalid) parts.push(el('span', { class: 'bad' }, session ? 'not a code, counts as 0' : 'not a number, counts as 0'));
  it.sub.replaceChildren(...parts.flatMap((p, i) => (i ? [' · ', p] : [p])));
  if (it.codes) {
    for (const [code, b] of it.codes) b.setAttribute('aria-pressed', String(value.trim() === code));
    it.clearBtn.disabled = value.trim() === '';
  }
}

function fmtMax(column) { return String(Grades.round2(maxOf(column))); }

// Column line (Attendance: the counts line), the picked option's progress and the unsaved badge.
function refreshCounts() {
  const col = currentColumn();
  if (state.view === 'attendance') {
    cm.line.textContent = col ? codeCounts(col.name) : '';
    return refreshChrome();
  }
  const k = col ? enteredCount(col.name) : 0;
  const total = state.rows.length;
  const max = col && col.category !== 'attendance' ? ' · max ' + fmtMax(col.name) : '';
  cm.line.textContent = col ? col.category + max + ' · ' + k + ' of ' + total + ' entered' : '';
  const opt = col && cm.select.selectedOptions[0];
  if (opt) opt.textContent = col.header + ' · ' + k + '/' + total;
  refreshChrome();
}

// `P n · L n · A n · X n · EA n · blank n`, unsaved values included; EA only when present.
function codeCounts(column) {
  const n = { P: 0, L: 0, A: 0, X: 0, EA: 0 };
  let blank = 0;
  for (const r of state.rows) {
    const code = cellValue(r, column).trim();
    if (code === '') blank += 1;
    else if (Object.prototype.hasOwnProperty.call(n, code)) n[code] += 1;
  }
  return ['P', 'L', 'A', 'X'].concat(n.EA ? ['EA'] : []).map((k) => k + ' ' + n[k]).concat('blank ' + blank)
    .join(' · ');
}

// The unsaved badge, the Save button, header line 2, the storage strip, and inputs locked while saving (S8.9).
function refreshChrome() {
  const n = state.edits.size;
  const j = state.open.journal;
  const pushed = state.open.push.pushed_at;
  for (const badge of [cm.badge, det && det.badge]) {
    if (!badge) continue;
    badge.hidden = n === 0;
    badge.replaceChildren(el('span', { 'aria-hidden': 'true' }, '● '), n + ' unsaved',
      el('span', { class: 'sr-only' }, n === 1 ? ' edit' : ' edits'));
  }
  cm.saveBtn.hidden = n === 0;
  cm.saveBtn.disabled = locked();
  cm.discardBtn.hidden = n === 0;
  cm.discardBtn.disabled = locked();
  cm.saveBtn.textContent = state.saving && cm.working ? cm.working : 'Save ' + n;
  cm.headLine.textContent = state.saving && cm.working ? cm.working : state.checking ? 'Checking Drive…' :
    'Pushed ' + F.fmtTime(pushed, state.now) +
    ' (' + F.fmtAgo(pushed, state.now) + ')' + (j.unpulled ? ' · ' + F.plural(j.unpulled, 'edit') + ' not pulled' : '');
  cm.strip.hidden = !state.storageOff;
  const col = currentColumn();
  cm.fill.disabled = locked() || !col;
  cm.fill.replaceChildren(...(WIDE.matches && col ? ['Fill… ', data('span', {}, col.header)] : ['Fill…']));
  for (const it of cm.items.concat(det ? det.items : [])) if (it.value.tagName === 'INPUT') it.value.readOnly = locked();
}

function announceCommit(it) {
  const value = cellValue(it.row, it.col.name);
  cm.announce.replaceChildren(it.col.name + ' ' + (value.trim() === '' ? 'blank' : value) + ' for ',
    data('span', {}, it.row.name), (edited(it.row, it.col.name) ? ', unsaved. ' : '. ') + state.edits.size +
    ' unsaved.');
}

function say(text) {
  clearTimeout(cm.statusTimer);
  cm.status.textContent = text;
  cm.statusTimer = setTimeout(() => { cm.status.textContent = ''; }, STATUS_MS);
}

// A message that stays until dismissed (conflicts, failures), with its buttons.
function alertBox(text, ...buttons) {
  cm.alert.replaceChildren(el('p', {}, text), el('div', { class: 'actions' }, ...buttons,
    el('button', { type: 'button', class: 'icon dismiss', 'aria-label': 'Dismiss',
      onclick: () => cm.alert.replaceChildren() }, '×')));
}

const shown = (value) => (String(value == null ? '' : value).trim() === '' ? 'blank' : value);

// ---- 6. Student detail (S4): full screen on a phone, a side panel on wide screens ----
const CODES = [['P', 'Present (P)'], ['L', 'Late (L)'], ['A', 'Absent (A)'], ['X', 'Excused (X)']];
let det = null;  // the open detail: its student, one item per column, the category totals and the summary card

function openDetail(row) {
  if (!det) {
    det = { panel: el('section', { class: 'detail', 'aria-labelledby': 'det-name' }) };
    app.append(det.panel);
  }
  det.row = row;
  renderDetail();
  det.panel.scrollTop = 0;
  det.name.focus();
}

// Back to the list it came from, focus on that student's row (in the table: the name cell).
function closeDetail() {
  const row = det.row;
  det.panel.remove();
  det = null;
  const rec = tb && tb.byId.get(row.student_id);
  const it = cm.items.find((x) => x.row === row);
  if (rec) {
    focusCell(rec.r, 1);
  } else if (it) {
    it.who.focus({ preventScroll: true });
    reveal(it.li);
  }
}

// The students the list shows, in its order (Prev / Next step through them).
function shownRows() { return state.rows.filter((r) => matches(r, state.search)); }

function renderDetail() {
  const row = state.byId.get(det.row.student_id);
  if (!row) return closeDetail();
  det.row = row;
  det.items = [];
  det.sections = [];
  const col = currentColumn();
  const table = state.category === 'attendance' ? 'Attendance' : 'Table';
  const from = state.view === 'summary' ? 'Summary' : state.view === 'analytics' ? 'Overview'
    : state.view === 'table' ? table : col ? col.name : state.view === 'attendance' ? 'Attendance' : 'Scores';
  const back = button('‹ ' + from, closeDetail, 'btn outline det-back');
  back.setAttribute('aria-label', 'Back to ' + from);
  det.badge = el('button', { type: 'button', class: 'badge unsaved', hidden: '', onclick: openSaveSheet });
  det.bar = el('div', { class: 'det-bar' }, back, det.badge,
    el('button', { type: 'button', class: 'icon det-more', 'aria-label': 'More', 'aria-haspopup': 'dialog',
      onclick: openMore }, '⋯'));
  const order = shownRows();
  const i = order.indexOf(row);
  det.prev = button('‹ Prev', () => stepStudent(order[i - 1], 'prev'), 'btn outline');
  det.prev.disabled = i <= 0;
  det.next = button('Next ›', () => stepStudent(order[i + 1], 'next'), 'btn outline');
  det.next.disabled = i < 0 || i >= order.length - 1;
  det.name = data('h2', { id: 'det-name', class: 'det-name', tabindex: '-1' }, row.name);
  det.card = el('div', { class: 'det-card' });
  const group = state.groups.get(row.student_id);
  const sections = state.open.course.category_order.map((cat) => detailSection(row, cat)).filter(Boolean);
  det.panel.replaceChildren(det.bar,
    el('div', { class: 'det-who' }, el('span', { class: 'id' }, row.student_id + (group ? ' · ' + group : '')),
      el('div', { class: 'det-steps' }, det.prev, det.next)),
    det.name, det.card, ...sections);
  refreshSummary();
  refreshChrome();
}

// Prev / Next keep focus on the button pressed, or on the name once the end is reached.
function stepStudent(row, which) {
  det.row = row;
  renderDetail();
  const b = det[which];
  (b.disabled ? det.name : b).focus();
}

// One section per category: heading `{category}` + `{weighted} of {w}`, then its columns (collapsible).
function detailSection(row, cat) {
  const course = state.open.course;
  const cols = course.columns.filter((c) => c.category === cat);
  const weighted = Object.prototype.hasOwnProperty.call(course.weights, cat);
  if (!cols.length && !weighted) return null;
  const total = el('span', { class: 'num' });
  if (weighted) det.sections.push({ cat, total, of: Grades.round2(course.weights[cat] * 100) });
  const items = cols.map((c) => detailItem(row, c));
  const box = el('details', { class: 'det-cat' },
    el('summary', {}, data('span', { class: 'det-cat-name' }, cat), total),
    items.length ? el('ul', { class: 'det-items' }, ...items.map((it) => it.li)) : el('p', { class: 'muted' }, 'no columns'));
  box.open = !(cat === 'attendance' && cols.length > 6);
  return box;
}

// One column of the student: header verbatim (and `dropped`), then an input, or the code buttons for a session.
function detailItem(row, col) {
  const i = det.items.length;
  const it = { row, col, list: det.items, sub: el('p', { class: 'sub', id: 'dsub-' + i }) };
  it.msg = el('p', { class: 'msg', id: 'dmsg-' + i, role: 'alert' });
  it.dropped = el('span', { class: 'muted', hidden: '' }, ' dropped');
  if (col.category === 'attendance') it.value = el('span', { class: 'code' }); else scoreInput(it);
  it.li = el('li', { class: 'row det-item' },
    el('div', { class: 'who' }, el('span', {}, data('span', {}, col.header), it.dropped), it.sub),
    el('div', { class: 'cell' }, it.value, el('span', { class: 'mark', 'aria-hidden': 'true' }, '*')),
    col.category === 'attendance' ? codeButtons(it) : null, it.msg);
  det.items.push(it);
  refreshItem(it);
  return it;
}

function codeButtons(it) {
  it.codes = new Map(CODES.map(([code, label]) => {
    const b = button(code, () => setCode(it, code), 'btn code-btn code-' + code);
    b.setAttribute('aria-label', label);
    return [code, b];
  }));
  it.clearBtn = button('Clear', () => setCode(it, ''), 'btn outline');
  it.group = el('div', { class: 'codes', role: 'group', tabindex: '-1' }, ...it.codes.values(), it.clearBtn);
  it.group.setAttribute('aria-label', 'Attendance ' + it.col.header + ' for ' + it.row.name + ' ' + it.row.student_id);
  return it.group;
}

// A code tap; tapping the code the cell already holds does nothing. On the Attendance tab a code (not Clear) moves
// focus to the next student (S6.2). Clear stays on the student (its button is now disabled).
function setCode(it, code) {
  if (locked() || Grades.sameCell(code, cellValue(it.row, it.col.name))) return;
  setCell(it.row, it.col.name, code);
  changed(it.row);
  announceCommit(it);
  if (code && it.list === cm.items) focusRow(nextRow(it, 1));
  else if (!code) it.group.focus({ preventScroll: true });
}

// The next shown student row of the Attendance list (delta 1) or the previous one (-1).
function nextRow(it, delta) {
  const list = cm.items;
  for (let i = list.indexOf(it) + delta; i >= 0 && i < list.length; i += delta) if (!list[i].li.hidden) return list[i];
  return null;
}

// Focus on a student's code group, scrolled to the middle of the screen.
function focusRow(it) {
  if (!it) return;
  it.group.focus({ preventScroll: true });
  reveal(it.li);
}

// Attendance keys (Interface "Keyboard"): ↑ ↓ move, P L A X set the focused student's code and move down,
// Backspace/Delete clear. Enter on the name line opens the detail (it is a button).
function attendanceKey(e) {
  if (state.view !== 'attendance' || e.ctrlKey || e.metaKey || e.altKey) return;
  const it = cm.items.find((x) => x.li.contains(e.target));
  if (!it) return;
  const code = e.key.toUpperCase();
  let act = null;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') act = () => focusRow(nextRow(it, e.key === 'ArrowDown' ? 1 : -1));
  else if (CODES.some(([k]) => k === code)) act = () => setCode(it, code);
  else if (e.key === 'Backspace' || e.key === 'Delete') act = () => setCode(it, '');
  if (act) {
    e.preventDefault();
    act();
  }
}

// The summary card, category totals and `dropped` mark, from g (a preview) or the student's grades.
function refreshSummary(g) {
  const grades = g || gradeOf(det.row);
  const n = editCount(det.row);
  det.card.replaceChildren(
    el('p', { class: 'det-big' }, el('span', {}, 'Final Score ', el('strong', {}, grades.final_score)),
      el('span', {}, 'Grade ', el('strong', { class: gradeCls(grades.grade) }, grades.grade))),
    el('p', {}, 'Coursework Total ' + (grades.coursework_total || 0)));
  if (n) det.card.append(el('p', { class: 'unsaved' }, 'Includes ' + F.plural(n, 'unsaved edit')));
  for (const s of det.sections) s.total.textContent = grades.pct[s.cat] + ' of ' + s.of;
  for (const it of det.items) it.dropped.hidden = grades.dropped !== it.col.name;
}

// Typing in any input previews the detail's totals while the text is valid (S4.2); column null puts them back.
function preview(row, column, text) {
  if (!det || det.row !== row) return;
  const r = column == null ? { ok: false } : Grades.validateTyped(text);
  refreshSummary(r.ok ? gradeOf(row, column, r.value) : null);
}

// ---- 7. Wide table (S5) ----
const BIG_TABLE = 300 * 80;
let tb = null;  // the table: column specs, one record per student, the focused cell, the open editor or picker

// ID, Name, then per category its counted columns and its computed `{category} /{w}`, then the three totals.
// A Raw Details category (not All columns) shows only its own columns and total.
function tableColumns() {
  const course = state.open.course;
  if (state.category === 'attendance') return attColumns();
  const one = state.category !== '*';
  const specs = [{ kind: 'id', label: 'Student ID' }, { kind: 'name', label: 'Name' }];
  for (const cat of one ? [state.category] : Grades.navCategories(course)) {
    for (const col of course.columns) {
      if (col.category === cat) specs.push({ kind: cat === 'attendance' ? 'code' : 'score', col });
    }
    if (Object.prototype.hasOwnProperty.call(course.weights, cat)) {
      specs.push({ kind: 'calc', cat, label: cat + ' /' + Grades.round2(course.weights[cat] * 100) });
    }
  }
  if (one) return specs;
  specs.push({ kind: 'calc', key: 'coursework_total', label: 'Coursework Total' },
    { kind: 'calc', key: 'final_score', label: 'Final Score' }, { kind: 'calc', key: 'grade', label: 'Grade' });
  return specs;
}

const editable = (s) => s.kind === 'score' || s.kind === 'code';

// A large course shows `Building the table…` until its first paint.
function renderTable() {
  tb = null;
  if (state.rows.length * state.open.course.columns.length <= BIG_TABLE) return buildTable();
  cm.wrap.replaceChildren(el('p', { class: 'muted empty' }, 'Building the table…'));
  requestAnimationFrame(() => setTimeout(() => { if (state.view === 'table' && cm.wrap.isConnected) buildTable(); }));
}

function buildTable() {
  if (state.category !== '*' && !Grades.columnsOf(state.open.course, state.category).length) {
    cm.wrap.replaceChildren(data('p', { class: 'muted empty' }, 'No columns pushed for ' + state.category + '.'));
    return;
  }
  const specs = tableColumns();
  const grid = state.category === 'attendance';
  tb = { specs, recs: [], byId: new Map(), cur: null, edit: null, picker: null, grid, heads: [], att: null };
  if (grid) setAtt();
  const head = el('tr', { role: 'row', 'aria-rowindex': '1' }, ...specs.map(headCell));
  const body = el('tbody', {}, ...(grid && state.attSort ? byAttendance(state.rows) : state.rows).map(tableRow));
  tb.none = el('tr', { hidden: '' }, el('td', { class: 'tb-none', colspan: String(specs.length) }));
  body.append(tb.none);
  const cls = 'tb' + (grid ? ' att-grid' : '') + (grid && !WIDE.matches ? ' compact' : '');
  const table = el('table', { class: cls, role: 'grid', 'aria-label': grid ? 'Attendance' : 'Course table',
    'aria-rowcount': String(state.rows.length + 1), 'aria-colcount': String(specs.length) }, el('thead', {}, head), body);
  if (grid) table.append(attFoot());
  // A click on an ID or computed cell keeps focus where it was (they aren't focusable).
  table.addEventListener('mousedown', (e) => { if (e.target.closest('td:not([data-c])')) e.preventDefault(); });
  table.addEventListener('click', tableClick);
  table.addEventListener('dblclick', (e) => {
    const td = e.target.closest('td[data-c]');
    if (td && !tb.edit && tb.specs[+td.dataset.c].kind === 'score') startEdit(+td.dataset.r, +td.dataset.c, null);
  });
  table.addEventListener('keydown', tableKey);
  tb.pop = el('p', { class: 'tb-pop', role: 'alert', hidden: '' });
  cm.wrap.replaceChildren(table, tb.pop);
  // Focusing a cell scrolls it clear of the sticky header row and the frozen ID and Name.
  const nameAt = specs.findIndex((x) => x.kind === 'name');
  const name = head.children[nameAt];
  cm.wrap.style.scrollPaddingTop = head.offsetHeight + 'px';
  cm.wrap.style.scrollPaddingLeft = name.offsetLeft + name.offsetWidth + 'px';
  if (tb.recs.length) {
    tb.cur = { r: 0, c: nameAt };
    tb.recs[0].tds[nameAt].tabIndex = 0;
  }
  markPicked();
  searchTable();
  if (grid) {
    refreshAttGrid();
    scrollToLatest(head, name);
  }
}

// ---- 7b. Attendance grid (SPEC_attendance_grid.md): the table for the attendance category, both widths ----
const ATT_COLUMNS = [['total', 'Total'], ['P', 'P'], ['L', 'L'], ['A', 'A'], ['X', 'X'], ['blank', 'blank']];

// (ID,) Name, one `code` column per session (numbered), then Total and the code counts. Phones: no ID column (the ID
// goes under the name in the frozen column).
function attColumns() {
  return (WIDE.matches ? [{ kind: 'id', label: 'Student ID' }] : []).concat({ kind: 'name', label: 'Name' },
    sessions().map((col, i) => ({ kind: 'code', col, n: i + 1 })),
    ATT_COLUMNS.map(([key, label]) => ({ kind: 'att', key, label })));
}

function setAtt() {
  tb.att = attStats();
  tb.attHeld = new Map(tb.att.sessions.map((x) => [x.name, x]));
}

// Lowest % first; ties keep roster order; no held session yet goes last (A11).
function byAttendance(rows) {
  const att = attStats();
  const key = (r) => {
    const st = att.students.get(r.student_id);
    return st && st.pct !== null ? st.pct : Infinity;
  };
  return rows.slice().sort((a, b) => (key(a) === key(b) ? 0 : key(a) - key(b)));
}

// P L A X chips (EA as X); a blank in a held session is a dashed chip; anything else as written (shown invalid).
function attChip(value, column) {
  const code = String(value == null ? '' : value).trim();
  const kind = { P: 'P', L: 'L', A: 'A', X: 'X', EA: 'X' }[code];
  if (kind) return el('span', { class: 'att-chip att-' + kind }, code);
  if (code === '') {
    const held = tb && tb.attHeld && tb.attHeld.get(column);
    return held && held.held ? el('span', { class: 'att-chip att-blank' }, el('span', { class: 'sr-only' }, 'blank'))
      : '';
  }
  return THAI.test(code) ? data('span', {}, value) : value;
}

function paintAttCell(row, s, td) {
  const st = tb.att && tb.att.students.get(row.student_id);
  if (s.key === 'total') {
    const risk = !!(st && st.atRisk);
    td.replaceChildren(Grades.fmtAttTotal(st), risk ? el('span', { 'aria-hidden': 'true' }, ' ⚠') : '',
      risk ? el('span', { class: 'sr-only' }, ', under 80%') : '');
    td.classList.toggle('at-risk', risk);
    return;
  }
  const n = st ? st.counts[s.key] : 0;
  td.textContent = n;
  td.classList.toggle('bad', s.key === 'A' && n > 0);
}

// The footer: each session's present count (P+L+X+EA); the full counts in its title and accessible name (A10).
function attFoot() {
  tb.foot = tb.specs.map((s) => el('td', { class: 'c-' + s.kind }));
  tb.foot[tb.specs.findIndex((x) => x.kind === 'name')].textContent = 'Present';
  return el('tfoot', {}, el('tr', { class: 'att-foot' }, ...tb.foot));
}

const countsText = (c) => 'P ' + c.P + ' · L ' + c.L + ' · A ' + c.A + ' · X ' + c.X + ' · blank ' + c.blank;

// Every number of the grid from the current values: rows, headers (today; `•` = a held session with blanks), footer.
function refreshAttGrid() {
  setAtt();
  for (const rec of tb.recs) paintRow(rec);
  const now = today();
  for (const { b, s } of tb.heads) {
    const x = tb.attHeld.get(s.col.name);
    const isToday = Grades.sessionDate(s.col.header) === now;
    b.classList.toggle('today', isToday);
    b.querySelector('.att-dot').textContent = x.held && x.counts.blank ? '•' : '';
    b.setAttribute('aria-label', s.col.header + (isToday ? ', today' : '') + ': ' + countsText(x.counts) +
      '. Open this session');
  }
  tb.specs.forEach((s, c) => {
    if (s.kind !== 'code') return;
    const x = tb.attHeld.get(s.col.name);
    tb.foot[c].textContent = x.present;
    tb.foot[c].title = countsText(x.counts);
    tb.foot[c].setAttribute('aria-label', s.col.header + ': ' + x.present + ' present (' + countsText(x.counts) + ')');
  });
}

// Opens with the latest held session and Total in view (A4).
function scrollToLatest(head, name) {
  const held = tb.specs.map((s, c) => [s, c]).filter(([s]) => s.kind === 'code' && tb.attHeld.get(s.col.name).held);
  if (!held.length) return;
  const th = head.children[held[held.length - 1][1]];
  cm.wrap.scrollLeft = Math.max(0, th.offsetLeft - (name.offsetLeft + name.offsetWidth) - 2 * th.offsetWidth);
}

// The one-session view (today's attendance taking) for a session; `‹ Grid` comes back.
function openSession(column) {
  state.tab = 'raw';
  state.category = 'attendance';
  state.session = column;
  state.attSession = true;
  rememberUi();
  renderView();
}

function refreshAttBar() {
  const t = todaySession();
  cm.takeToday.disabled = !t;
  cm.takeToday.textContent = t ? 'Take today ›' : 'No session today';
  cm.riskBtn.setAttribute('aria-pressed', String(state.attRisk));
  cm.sortBtn.setAttribute('aria-pressed', String(state.attSort));
  cm.sortBtn.textContent = state.attSort ? 'Sort: Lowest %' : 'Sort: Roster';
}

// Headers verbatim; a counted column's header selects it (for Fill…); computed ones announce "computed".
function headCell(s, c) {
  const th = el('th', { role: 'columnheader', scope: 'col', 'aria-colindex': String(c + 1), class: 'c-' + s.kind });
  if (s.n) {
    // A grid session: its number over the short date; it opens the one-session view (A3).
    const b = el('button', { type: 'button', class: 'th-btn att-head', 'data-col': s.col.name,
      onclick: () => openSession(s.col.name) }, el('span', { class: 'att-n' }, String(s.n)),
    el('span', { class: 'att-d' }, Grades.shortDate(s.col.header)),
    el('span', { class: 'att-dot', 'aria-hidden': 'true' }));
    tb.heads.push({ b, s });
    th.append(b);
  } else if (s.col) {
    th.append(el('button', { type: 'button', class: 'th-btn', 'data-col': s.col.name,
      onclick: () => { pickColumn(s.col.name); markPicked(); refreshChrome(); } }, data('span', {}, s.col.header)));
  } else {
    th.append(data('span', {}, s.label));
    if (s.kind === 'calc') th.append(el('span', { class: 'sr-only' }, ' (computed)'));
  }
  return th;
}

function markPicked() {
  for (const b of cm.wrap.querySelectorAll('.th-btn')) {
    b.setAttribute('aria-pressed', String(b.dataset.col === state.column));
  }
}

function tableRow(row, r) {
  const tr = el('tr', { role: 'row', 'aria-rowindex': String(r + 2) });
  const tds = tb.specs.map((s, c) => {
    const frozen = s.kind === 'id' || s.kind === 'name';
    const td = el('td', { role: frozen ? 'rowheader' : 'gridcell', 'aria-colindex': String(c + 1), class: 'c-' + s.kind });
    if (s.kind === 'calc' || s.kind === 'att') td.setAttribute('aria-readonly', 'true');
    if (s.kind !== 'id' && s.kind !== 'calc' && s.kind !== 'att') {
      td.tabIndex = -1;
      td.dataset.r = r;
      td.dataset.c = c;
    }
    return td;
  });
  tr.append(...tds);
  const rec = { row, r, tr, tds };
  tb.recs.push(rec);
  tb.byId.set(row.student_id, rec);
  paintRow(rec);
  return tr;
}

function paintRow(rec) {
  const g = gradeOf(rec.row);
  rec.tr.classList.toggle('has-unsaved', editCount(rec.row) > 0);
  tb.specs.forEach((s, c) => paintCell(rec, s, rec.tds[c], g));
}

// Same marks as column mode (S5.2): unsaved amber + `*`, above max red + `▲`, invalid red + dotted underline.
function paintCell(rec, s, td, g) {
  const row = rec.row;
  if (s.kind === 'id') {
    td.textContent = row.student_id;
  } else if (s.kind === 'name') {
    td.textContent = row.name;
    if (THAI.test(row.name)) td.lang = 'th';
    if (tb.grid && !WIDE.matches) td.append(el('span', { class: 'sub', lang: 'en' }, row.student_id));
  } else if (s.kind === 'att') {
    paintAttCell(row, s, td);
  } else if (s.kind === 'calc') {
    td.textContent = s.cat ? g.pct[s.cat] : s.key === 'coursework_total' ? g.coursework_total || 0 : g[s.key];
    if (s.key === 'grade') td.replaceChildren(el('span', { class: gradeCls(g.grade) }, g.grade));
  } else if (!(tb.edit && tb.edit.td === td)) {
    const name = s.col.name;
    const value = cellValue(row, name);
    const e = edited(row, name);
    const over = s.kind === 'score' && overMax(value, name);
    td.classList.toggle('unsaved', !!e);
    td.classList.toggle('over', over);
    td.classList.toggle('invalid', s.kind === 'score' ? Grades.classify(value)[0] === 'invalid' : badCode(value));
    td.replaceChildren(s.kind === 'code' ? attChip(value, name) : THAI.test(value) ? data('span', {}, value) : value);
    if (over) td.append(el('span', { 'aria-hidden': 'true' }, '▲'), el('span', { class: 'sr-only' }, ' above max'));
    if (e) td.append(el('span', { class: 'mark', 'aria-hidden': 'true' }, '*'), el('span', { class: 'sr-only' }, ' unsaved'));
  }
}

function searchTable() {
  let shown = 0;
  const riskOnly = tb.grid && state.attRisk;
  for (const rec of tb.recs) {
    const st = riskOnly && tb.att.students.get(rec.row.student_id);
    rec.tr.hidden = !matches(rec.row, state.search) || (riskOnly && !(st && st.atRisk));
    if (!rec.tr.hidden) shown += 1;
  }
  tb.none.hidden = shown > 0;
  tb.none.firstChild.replaceChildren(state.search.trim() === '' && riskOnly ? 'Nobody is under 80% so far.'
    : data('span', {}, 'No students match "' + state.search.trim() + '"'));
}

// Roving focus: the focused cell is the table's one tab stop.
function focusCell(r, c) {
  if (tb.cur) tb.recs[tb.cur.r].tds[tb.cur.c].tabIndex = -1;
  tb.cur = { r, c };
  const td = tb.recs[r].tds[c];
  td.tabIndex = 0;
  td.focus();
}

// Moves to the next shown row (dr) or the next name or editable column (dc); stays at the edges.
function stepCell(r, c, dr, dc) {
  if (dr) {
    for (let i = r + dr; i >= 0 && i < tb.recs.length; i += dr) if (!tb.recs[i].tr.hidden) return focusCell(i, c);
    return focusCell(r, c);
  }
  for (let j = c + dc; j >= 0 && j < tb.specs.length; j += dc) {
    if (tb.specs[j].kind === 'name' || editable(tb.specs[j])) return focusCell(r, j);
  }
  return focusCell(r, c);
}

function tableClick(e) {
  const td = e.target.closest('td[data-c]');
  if (!td || (tb.edit && tb.edit.td === td)) return;
  const r = +td.dataset.r;
  const c = +td.dataset.c;
  focusCell(r, c);
  if (tb.specs[c].kind === 'name') openDetail(tb.recs[r].row);
  else if (tb.specs[c].kind === 'code') openPicker(r, c);
}

// Navigation mode (Interface "Keyboard"): grade-tui parity, Enter edits, `-` = ขส and P/L/A/X move down.
function tableKey(e) {
  const td = e.target.closest('td[data-c]');
  if (!td || e.target !== td) return;
  const r = +td.dataset.r;
  const c = +td.dataset.c;
  const s = tb.specs[c];
  const arrow = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
  if (arrow) {
    e.preventDefault();
    return stepCell(r, c, arrow[0], arrow[1]);
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (s.kind === 'name') {
    if (e.key === 'Enter') {
      e.preventDefault();
      openDetail(tb.recs[r].row);
    }
    return;
  }
  if (locked()) return;
  const code = e.key.toUpperCase();
  let act = null;
  if (e.key === 'Enter') act = () => (s.kind === 'score' ? startEdit(r, c, null) : openPicker(r, c));
  else if (e.key === 'Backspace' || e.key === 'Delete') act = () => keySet(r, c, '', false);
  else if (s.kind === 'score' && e.key === '-') act = () => keySet(r, c, Grades.ABSENT, true);
  else if (s.kind === 'score' && /^[0-9.]$/.test(e.key)) act = () => startEdit(r, c, e.key);
  else if (s.kind === 'code' && CODES.some(([k]) => k === code)) act = () => keySet(r, c, code, true);
  if (act) {
    e.preventDefault();
    act();
  }
}

// A value set without typing (blank, ขส, a code); it is always valid.
function keySet(r, c, value, thenDown) {
  const rec = tb.recs[r];
  const col = tb.specs[c].col;
  if (!Grades.sameCell(value, cellValue(rec.row, col.name))) {
    showPop(null, '');
    setCell(rec.row, col.name, value);
    changed(rec.row);
    announceCommit({ row: rec.row, col });
  }
  if (thenDown) stepCell(r, c, 1, 0);
}

// The cell editor; `initial` is the key that started it (null: edit the current value).
function startEdit(r, c, initial) {
  const rec = tb.recs[r];
  const col = tb.specs[c].col;
  const td = rec.tds[c];
  const input = el('input', { type: 'text', class: 'tb-input', inputmode: 'decimal', autocomplete: 'off',
    autocorrect: 'off', spellcheck: 'false' });
  input.setAttribute('aria-label', col.header + ' for ' + rec.row.name + ' ' + rec.row.student_id);
  input.value = initial == null ? cellValue(rec.row, col.name) : initial;
  tb.edit = { r, c, td, input };
  td.replaceChildren(input);
  input.focus();
  if (initial == null) input.select();
  input.addEventListener('input', () => {
    const text = input.value;
    const v = Grades.validateTyped(text);
    showPop(td, Grades.sameCell(text, cellValue(rec.row, col.name)) || v.ok ? '' : refusalText(text.trim(), v.reason));
    preview(rec.row, col.name, text);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      closeEditor();
      showPop(null, '');
      preview(rec.row, null);
      return focusCell(r, c);
    }
    const go = { Enter: [1, 0], ArrowDown: [1, 0], ArrowUp: [-1, 0], Tab: [0, e.shiftKey ? -1 : 1] }[e.key];
    if (!go) return;
    e.preventDefault();
    if (commitEdit()) stepCell(r, c, go[0], go[1]);
  });
  // Leaving with refused text puts the previous value back; the message stays until the next commit.
  input.addEventListener('blur', () => {
    if (!tb.edit || tb.edit.input !== input) return;
    if (!commitEdit()) {
      closeEditor();
      preview(rec.row, null);
    }
  });
}

// Commits the editor (Typing rules). False when refused: the editor stays with its text selected.
function commitEdit() {
  const { r, c, td, input } = tb.edit;
  const rec = tb.recs[r];
  const col = tb.specs[c].col;
  const res = commitTyped(rec.row, col.name, input.value);
  if (res.refused) {
    showPop(td, res.refused);
    input.select();
    return false;
  }
  closeEditor();
  showPop(null, '');
  if (res.changed) {
    changed(rec.row);
    announceCommit({ row: rec.row, col });
  }
  return true;
}

function closeEditor() {
  const { r, c, td } = tb.edit;
  tb.edit = null;
  paintCell(tb.recs[r], tb.specs[c], td, gradeOf(tb.recs[r].row));
}

// The refusal popover under a cell (empty message: hidden).
function showPop(td, message) {
  tb.pop.textContent = message;
  tb.pop.hidden = !message;
  if (message) place(tb.pop, td);
}

function place(node, td) {
  const w = cm.wrap.getBoundingClientRect();
  const b = td.getBoundingClientRect();
  node.style.top = b.bottom - w.top + cm.wrap.scrollTop + 'px';
  node.style.left = b.left - w.left + cm.wrap.scrollLeft + 'px';
}

// The attendance picker `P L A X Clear` under a session cell.
function openPicker(r, c) {
  if (locked()) return;
  closePicker();
  const rec = tb.recs[r];
  const col = tb.specs[c].col;
  const value = cellValue(rec.row, col.name).trim();
  const pick = (code) => {
    closePicker();
    keySet(r, c, code, false);
    focusCell(r, c);
  };
  const box = el('div', { class: 'tb-picker', role: 'group' }, ...CODES.map(([code, label]) => {
    const b = button(code, () => pick(code), 'btn code-btn code-' + code);
    b.setAttribute('aria-label', label);
    b.setAttribute('aria-pressed', String(value === code));
    return b;
  }), button('Clear', () => pick(''), 'btn outline'));
  box.setAttribute('aria-label', 'Attendance ' + col.header + ' for ' + rec.row.name + ' ' + rec.row.student_id);
  box.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    e.preventDefault();
    e.stopPropagation();
    closePicker();
    focusCell(r, c);
  });
  // Safari doesn't focus a pressed button: the press would blur the picker (relatedTarget null) and close it before
  // the click lands. Keeping focus where it is lets the click through; a press outside still closes it.
  box.addEventListener('mousedown', (e) => e.preventDefault());
  box.addEventListener('focusout', (e) => { if (!box.contains(e.relatedTarget)) closePicker(); });
  tb.picker = box;
  cm.wrap.append(box);
  place(box, rec.tds[c]);
  // Keep it on screen near the right edge (phones: the grid's last sessions).
  const over = box.getBoundingClientRect().right - cm.wrap.getBoundingClientRect().right;
  if (over > 0) box.style.left = Math.max(cm.wrap.scrollLeft, parseFloat(box.style.left) - over - 4) + 'px';
  box.querySelector('button').focus();
}

function closePicker() {
  if (!tb || !tb.picker) return;
  const box = tb.picker;
  tb.picker = null;
  box.remove();
}

// ---- Dialogs (9-12 and the More sheet). The element with `autofocus` gets the initial focus ----
let dialogCount = 0;
function dialog(title, ...content) {
  const id = 'dialog-' + (++dialogCount);
  const d = el('dialog', { class: 'sheet', 'aria-labelledby': id }, el('h2', { id }, title), ...content);
  d.addEventListener('close', () => d.remove());
  document.body.append(d);
  d.showModal();
  return d;
}

function autofocused(node) {
  node.setAttribute('autofocus', '');
  return node;
}

// ---- 8. Fill Column sheet (S7): the cells go in as unsaved edits, nothing is written to Drive ----
function openFill() {
  const col = currentColumn();
  if (!col || locked()) return;
  const att = col.category === 'attendance';
  let mode = 'empty';
  let value = att ? 'P' : null;  // null: no valid value typed yet
  let plan = [];
  const msg = el('p', { class: 'msg', id: 'fill-msg', role: 'alert' });
  const hint = el('p', { class: 'muted' });
  const count = el('p', { class: 'fill-count' });
  const ea = el('p', { class: 'muted' });
  const go = button('', () => {
    if (!plan.length) return;
    d.close();
    fillColumn(col.name, plan);
    renderView();
    say('Filled ' + F.plural(plan.length, 'cell') + ' (unsaved)');
  });
  const update = () => {
    plan = value == null ? [] : fillPlan(col.name, value, mode);
    const eas = att && mode === 'whole'
      ? plan.filter((t) => cellValue(state.byId.get(t.student_id), col.name).trim() === 'EA').length : 0;
    hint.textContent = value == null && !msg.textContent ? 'Type a value, or tap ขส.' : '';
    count.textContent = value == null ? '' : '→ ' + F.plural(plan.length, 'cell') + ' will change';
    ea.textContent = eas ? 'Includes ' + F.plural(eas, 'EA cell') + '.' : '';
    go.disabled = !plan.length;
    go.textContent = value == null ? 'Fill…' : plan.length ? 'Fill ' + F.plural(plan.length, 'cell') : 'Nothing to change';
  };
  const radio = (m, label) => {
    const r = el('input', { type: 'radio', name: 'fill-cells', value: m });
    r.checked = m === mode;
    r.addEventListener('change', () => { mode = m; update(); });
    return el('label', { class: 'radio' }, r, label);
  };
  const d = dialog(el('span', {}, 'Fill ', data('span', {}, col.header)),
    el('fieldset', { class: 'fill-cells' }, el('legend', {}, 'Cells'), radio('empty', 'Only empty cells'),
      radio('whole', 'Whole column')),
    att ? codeChoice() : typedValue(), msg, hint, count, ea,
    state.search.trim() ? el('p', { class: 'muted' }, 'Fill covers all ' + F.plural(state.rows.length, 'student') +
      ', not only the ones your search shows.') : null,
    el('div', { class: 'sheet-actions' }, button('Cancel', () => d.close(), 'btn outline'), go));
  update();
  // Tapping outside the sheet closes it without changes (Esc does too, natively).
  d.addEventListener('click', (e) => {
    const r = d.getBoundingClientRect();
    if (e.target === d && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) {
      d.close();
    }
  });
  const title = d.querySelector('h2');
  title.tabIndex = -1;
  title.focus();

  // Attendance: one of P L A X Clear pressed at a time (S7.4).
  function codeChoice() {
    const choices = CODES.concat([['', 'Clear']]).map(([code, label]) => {
      const b = button(code || 'Clear', () => {
        value = code;
        for (const [c, x] of choices) x.setAttribute('aria-pressed', String(c === value));
        update();
      }, code ? 'btn code-btn code-' + code : 'btn outline code-btn fill-clear');
      b.setAttribute('aria-label', label);
      b.setAttribute('aria-pressed', String(code === value));
      return [code, b];
    });
    return el('div', { class: 'fill-row' }, el('span', { id: 'fill-vlabel' }, 'Value'),
      el('div', { class: 'codes', role: 'group', 'aria-labelledby': 'fill-vlabel' }, ...choices.map((c) => c[1])));
  }

  // Scores: the typing rules (S3.7); a refused or blank value disables Fill.
  function typedValue() {
    const input = el('input', { type: 'text', id: 'fill-value', class: 'score', inputmode: 'decimal',
      enterkeyhint: 'done', autocomplete: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-describedby': 'fill-msg' });
    const typed = () => {
      const text = input.value;
      const r = Grades.validateTyped(text);
      const blank = text.trim() === '';
      msg.textContent = blank || r.ok ? '' : refusalText(text.trim(), r.reason);
      input.classList.toggle('refused', msg.textContent !== '');
      value = !blank && r.ok ? r.value : null;
      update();
    };
    input.addEventListener('input', typed);
    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      go.click();
    });
    const absent = button('ขส', () => { input.value = Grades.ABSENT; typed(); }, 'btn outline');
    absent.lang = 'th';
    return el('div', { class: 'fill-row' }, el('label', { for: 'fill-value' }, 'Value'), input, absent);
  }
}

// `Wed 21 Jan 2027` for a 'YYYY-MM-DD' date (edge 47).
function longDate(iso) {
  const d = new Date(iso + 'T00:00:00Z');
  const day = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getUTCDay()];
  const month = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getUTCMonth()];
  return day + ' ' + d.getUTCDate() + ' ' + month + ' ' + d.getUTCFullYear();
}

// ---- 9. Save (S8) ----
function openSaveSheet() {
  if (!state.edits.size || locked()) return;
  const edits = Array.from(state.edits.values());
  const gone = edits.filter(isGone);
  const n = edits.length;
  let over = 0;
  const groups = state.open.course.columns.map((c) => {
    const es = edits.filter((e) => e.column === c.name && !isGone(e));
    if (!es.length) return null;
    const m = es.filter((e) => overMax(e.value, c.name)).length;
    over += m;
    return el('details', { class: 'save-col' },
      el('summary', {}, data('span', {}, c.header), el('span', { class: 'num' },
        F.plural(es.length, 'cell') + (m ? ', ' + m + ' above max' : ''))),
      el('ul', { class: 'cell-lines' }, ...es.map((e) => el('li', {}, cellLine(e)))));
  });
  const save = autofocused(button('Save ' + F.plural(n, 'cell'), () => { d.close(); doSave(false); }));
  const d = dialog('Save ' + F.plural(n, 'cell') + '?', ...groups,
    over ? el('p', { class: 'warn' }, over === 1 ? '1 is above max; it will be saved as typed.'
      : over + ' are above max; they will be saved as typed.') : null,
    gone.length ? el('div', { class: 'gone' },
      el('p', {}, gone.length + " can't be saved: student or column not in this course."),
      el('ul', { class: 'cell-lines' }, ...gone.map((e) => el('li', {}, e.student_id + ' ' + e.column + ': ' +
        shown(e.original) + ' → ' + shown(e.value)))),
      button('Drop these ' + gone.length, () => { d.close(); dropGone(); renderView(); }, 'btn outline')) : null,
    el('div', { class: 'sheet-actions' }, button('Discard all…', () => { d.close(); openDiscard(); }, 'btn outline'),
      save),
    el('div', { class: 'sheet-actions' }, button('Keep editing', () => d.close(), 'btn outline')));
}

// `{id} {name}: {was} → {new}`
function cellLine(e) {
  const row = state.byId.get(e.student_id);
  return el('span', {}, el('span', { class: 'id' }, e.student_id), ' ', row ? data('span', {}, row.name) : null,
    ': ' + shown(e.original) + ' → ' + shown(e.value));
}

// Saves every unsaved edit; `after` runs when none is left (Save and leave). A Retry resends the same edits.
function doSave(retrying, after) {
  if (locked() || !state.edits.size) return;
  const n = state.edits.size;
  cm.working = 'Saving ' + F.plural(n, 'cell') + '…';
  cm.alert.replaceChildren();
  saveEdits().then((reply) => {
    renderView();
    if (!reply.ok) return saveRefused(reply, n, after);
    const listed = reply.conflicts.filter((c) => c.reason !== 'not found');
    const nothing = !retrying && !reply.batch && !reply.saved.length && !reply.conflicts.length;
    const text = nothing ? 'Nothing to save: Drive already has these values'
      : F.saveResult(reply, state.open.course.columns);
    if (reply.conflicts.length) {
      alertBox(text, listed.length > 3 ? button('Show all', () => openConflicts(listed), 'btn outline') : null);
    } else {
      say(text);
    }
    if (after && !state.edits.size) after();
  }, (err) => {
    refreshChrome();
    const kind = failureKind(err);
    if (kind === 'auth') {
      return alertBox('Signed out of Google. Sign in again; your edits are kept.',
        button('Sign in', () => location.reload(), 'btn outline'));
    }
    alertBox((kind === 'offline' ? "Save failed: you're offline. " : "Save failed: Google didn't finish the save. ") +
      kept(n), button('Retry', () => doSave(true, after), 'btn outline'));
  });
  refreshChrome();
}

function kept(n) {
  return 'Your ' + F.plural(n, 'edit') + (n === 1 ? ' is' : ' are') + ' kept.';
}

function saveRefused(reply, n, after) {
  if (reply.code === 'BUSY') {
    return alertBox('Another save is running; try again. ' + kept(n),
      button('Retry', () => doSave(true, after), 'btn outline'));
  }
  if (reply.code === 'UNAVAILABLE' || reply.code === 'NOT_FOUND') {
    return alertBox('Not saved: ' + reply.message + ' Your ' + F.plural(n, 'edit') + (n === 1 ? ' is' : ' are') +
      ' kept on this device.', button('Back to courses', backToCourses, 'btn outline'));
  }
  alertBox("Save failed: Google didn't finish the save. " + kept(n),
    button('Retry', () => doSave(true, after), 'btn outline'));
}

function openConflicts(conflicts) {
  const d = dialog('Changed elsewhere, not saved (' + conflicts.length + ')',
    el('ul', { class: 'conf-list' }, ...conflicts.map((c) => {
      const row = state.byId.get(c.student_id);
      const e = state.edits.get(editKey(c.student_id, c.column));
      const mine = e ? e.value : '';
      const line = c.reason === 'invalid'
        ? "Drive refused '" + mine + "' for " + c.student_id + ' ' + c.column + ': not a valid score.'
        : c.column + '   Drive now ' + shown(c.now) + ' · yours ' + shown(mine);
      return el('li', {},
        el('p', {}, el('span', { class: 'id' }, c.student_id), ' ', row ? data('span', {}, row.name) : null),
        el('div', { class: 'conf-line' }, el('span', {}, line),
          button('Go to', () => { d.close(); goTo(c.student_id, c.column); }, 'btn outline')));
    })),
    el('p', { class: 'muted' }, 'These stay unsaved. Save again to write your values, or change them first.'),
    el('div', { class: 'sheet-actions' }, button('Close', () => d.close(), 'btn outline')));
}

// Opens the column with the student's row focused (in the table: the student's cell).
function goTo(sid, column) {
  if (state.search) {
    state.search = '';
    cm.search.value = '';
    applySearch();
  }
  if (state.view === 'table' || (state.tab !== 'raw' && WIDE.matches)) {
    const col = state.open.course.columns.find((x) => x.name === column);
    if (col && (state.tab !== 'raw' || (state.category !== '*' && state.category !== col.category))) {
      setCategory(col.category);
    }
    const rec = tb && tb.byId.get(sid);
    const c = tb ? tb.specs.findIndex((s) => s.col && s.col.name === column) : -1;
    if (rec && c >= 0) focusCell(rec.r, c);
    return;
  }
  choose(column);
  const it = cm.items.find((x) => x.row.student_id === sid);
  if (!it) return;
  reveal(it.li);
  if (it.value.tagName === 'INPUT') it.value.focus({ preventScroll: true });
}

function backToCourses() {
  closeCourse();
  showCourses();
}

// ---- 10. Discard (S8.10) ----
// `refocus`: opened from the action bar's Discard, which hides with the edits, so focus moves on to the column
// picker (column mode), the student's name (detail) or the course name.
function openDiscard(refocus) {
  const n = state.edits.size;
  if (!n || locked()) return;
  const d = dialog('Discard ' + F.plural(n, 'unsaved edit') + '?',
    el('p', {}, "They were never saved to Drive and can't be brought back."),
    el('div', { class: 'sheet-actions' }, autofocused(button('Keep edits', () => d.close(), 'btn outline')),
      button('Discard ' + F.plural(n, 'edit'), () => {
        d.close();
        discardEdits();
        if (cm.banner) cm.banner.remove();
        renderView();
        say('Discarded ' + F.plural(n, 'edit'));
        if (refocus) (det ? det.name : cm.select.offsetParent ? cm.select : app.querySelector('h1')).focus();
      }, 'btn danger')));
}

// ---- 11. Undo last save (S9) ----
function openUndo() {
  const t = state.open.journal.undo;
  if (!t || state.edits.size || locked()) return;
  const lines = t.edits.map((e) => {
    const row = state.byId.get(e.student_id);
    return el('li', {}, el('span', { class: 'id' }, e.student_id), ' ', row ? data('span', {}, row.name) : null,
      ' ' + e.column + ': ' + shown(e.value) + ' → ' + shown(e.original));
  });
  if (t.cells > t.edits.length) lines.push(el('li', { class: 'muted' }, 'and ' + (t.cells - t.edits.length) + ' more'));
  const d = dialog(F.undoTitle(t, state.now), el('ul', { class: 'cell-lines' }, ...lines),
    el('p', {}, 'Drive gets the earlier values back. Cells changed since then are left alone.'),
    el('div', { class: 'sheet-actions' }, autofocused(button('Cancel', () => d.close(), 'btn outline')),
      button('Undo save', () => { d.close(); doUndo(t); })));
}

function doUndo(t) {
  cm.working = 'Undoing save of ' + F.fmtTime(t.ts, state.now) + '…';
  cm.alert.replaceChildren();
  undoLastSave(t.batch).then((reply) => {
    renderView();
    if (reply.ok) {
      const text = F.undoResult(reply, t, state.now);
      return reply.conflicts.length ? alertBox(text) : say(text);
    }
    if (reply.code === 'UNDO_CHANGED') {
      return alertBox('Another device saved since this page loaded. Reload to see the newest save, then try again.',
        button('Reload', reload, 'btn outline'));
    }
    if (reply.code === 'UNAVAILABLE' || reply.code === 'NOT_FOUND') {
      return alertBox('Not saved: ' + reply.message, button('Back to courses', backToCourses, 'btn outline'));
    }
    if (reply.code === 'BUSY') {
      return alertBox('Another save is running; try again.', button('Retry', () => doUndo(t), 'btn outline'));
    }
    alertBox(String(reply.message).replace(/`/g, ''));
  }, (err) => {
    refreshChrome();
    alertBox(failureKind(err) === 'offline' ? "You're offline. Connect, then try again."
      : "Google didn't answer. Try again in a moment.");
  });
  refreshChrome();
}

// ---- 12. Leaving with unsaved edits (S8.7) ----
function leave(then) {
  const n = state.edits.size;
  const forms = CONFIG_PARTS.filter(formChanged)
    .map((part) => (part === 'weights' ? 'Weights not saved.' : 'Boundaries not saved.')).join(' ');
  const go = () => { closeCourse(); then(); };
  // while checking nothing can be typed: the edits are all in the draft already
  if ((!n && !forms) || state.checking) return go();
  if (state.saving) return;
  if (!n) {
    const f = dialog(forms, el('div', { class: 'sheet-actions' },
      autofocused(button('Keep editing', () => f.close(), 'btn outline')),
      button('Leave', () => { f.close(); go(); }, 'btn outline')));
    return;
  }
  const d = dialog(el('span', {}, F.plural(n, 'unsaved edit') + ' in ', data('span', {}, state.open.course.course_name)),
    el('p', {}, 'They stay on this device as a draft if you leave without saving.'),
    forms ? el('p', { class: 'warn' }, forms) : null,
    el('div', { class: 'sheet-actions' }, autofocused(button('Keep editing', () => d.close(), 'btn outline'))),
    el('div', { class: 'sheet-actions' }, button('Leave, keep draft', () => { d.close(); go(); }, 'btn outline'),
      button('Save and leave', () => { d.close(); doSave(false, go); })));
}

// ---- 13. Grading: weights and boundaries (S10) ----
let cfg = null;  // the Grading tab: per part, its fields, sum and preview lines, buttons and the "Saving…" text

function renderGrading() {
  cfg = {};
  cm.grading.replaceChildren(...CONFIG_PARTS.map(configSection), distSection(),
    el('p', { class: 'muted' }, "Undo last save doesn't cover weights or boundaries: change them back here."));
  for (const part of CONFIG_PARTS) refreshConfig(part);
}
