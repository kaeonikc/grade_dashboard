// grade-tui's Letter Grade Distribution (SPEC_grade_order D4): a bar and `6 (15.0%)` per letter, scale order then F.
function distSection() {
  const tag = el('span', { class: 'tag-preview', hidden: '' }, '(preview)');
  const list = el('ul', { class: 'dist' });
  cfg.dist = { tag, list };
  return el('section', { class: 'cfg', 'aria-labelledby': 'cfg-dist' },
    el('h2', { id: 'cfg-dist' }, 'Grade distribution', tag), list);
}

function refreshDistribution() {
  const d = cfg && cfg.dist;
  if (!d) return;
  const { rows, preview } = gradeDistribution();
  d.tag.hidden = !preview;
  d.list.replaceChildren(...barItems(rows.map((r) => ({ label: r.letter, cls: gradeCls(r.letter), count: r.count,
    pct: r.pct }))));
}

// Bar rows (`.dist`): label, a bar scaled to the largest count, `6 (15.0%)`. Empty counts: `No students yet.`
function barItems(rows) {
  const top = Math.max(0, ...rows.map((r) => r.count));
  if (!top) return [el('li', { class: 'muted' }, 'No students yet.')];
  return rows.map((r) => el('li', {}, el('span', { class: 'letter ' + r.cls }, r.label),
    el('span', { class: 'bar', 'aria-hidden': 'true' },
      el('span', { class: r.cls || 'plain', style: 'width: ' + (r.count / top) * 100 + '%' })),
    el('span', { class: 'count' }, r.count + ' (' + r.pct.toFixed(1) + '%)')));
}

// The colour class of a letter (grade-tui's grade_color_for).
function gradeCls(letter) { return 'g-' + Grades.gradeClass(letter); }

// One form: a labelled input per key (no control adds or removes a key, S10.4), its checks, Reset and Save.
function configSection(part) {
  const weights = part === 'weights';
  const form = configForm(part);
  const c = { fields: [], working: null };
  cfg[part] = c;
  const rows = configKeys(part).map((key, i) => {
    const id = 'cfg-' + part + '-' + i;
    const input = el('input', { id, type: 'text', class: 'score', inputmode: 'decimal', autocomplete: 'off',
      'aria-describedby': id + '-msg' });
    input.value = form[key];
    input.addEventListener('input', () => {
      form[key] = input.value;
      refreshConfig(part);
    });
    const msg = el('p', { class: 'msg', id: id + '-msg' });
    const range = weights ? null : el('span', { class: 'range' });
    const label = weights ? data('label', { for: id }, key) : el('span', { class: 'cfg-key' },
      data('label', { for: id, class: 'letter ' + gradeCls(key) }, key), range);
    const li = el('li', { class: 'row' }, label,
      el('span', { class: 'cell' }, input, el('span', { class: 'mark', 'aria-hidden': 'true' }, '*')), msg);
    c.fields.push({ key, input, msg, li, range });
    return li;
  });
  if (!weights) {
    c.lowest = el('span', { class: 'range' });
    rows.push(el('li', { class: 'row' }, el('span', { class: 'cfg-key' },
      el('span', { class: 'letter ' + gradeCls('F') }, 'F'), c.lowest)));
  }
  c.sum = weights ? el('p', {}) : null;
  c.preview = el('div', { class: 'cfg-preview' });
  c.reset = button('Reset', () => {
    delete state.forms[part];
    renderGrading();
  }, 'btn outline');
  c.save = button('', () => doSaveConfig(part));
  return el('section', { class: 'cfg', 'aria-labelledby': 'cfg-' + part },
    el('h2', { id: 'cfg-' + part }, weights ? 'Weights' : 'Grade boundaries (highest first)'),
    el('ul', { class: 'rows' }, ...rows), c.sum, c.preview, el('div', { class: 'sheet-actions' }, c.reset, c.save));
}

// Field messages and `*` marks, the sum line, the F row, the grade preview and the buttons, from the form.
function refreshConfig(part) {
  const c = cfg[part];
  const form = configForm(part);
  const problems = new Map(configProblems(part).map((p) => [p.field, p]));
  for (const f of c.fields) {
    const p = problems.get(f.key);
    f.li.classList.toggle('is-unsaved', configChanged(part, f.key));
    f.msg.textContent = p ? configMessage(p, form) : '';
    f.input.classList.toggle('refused', !!p);
    f.input.setAttribute('aria-invalid', String(!!p));
    f.input.readOnly = locked();
  }
  const values = problems.size ? null : configValues(part);
  if (c.lowest) {
    // Each letter's interval (`70 ≤ X < 75`), `—` while a field is refused.
    const ranges = values ? Grades.gradeRanges(configKeys(part), values) : [];
    const text = (letter) => (ranges.find((r) => r.letter === letter) || { text: '—' }).text;
    for (const f of c.fields) f.range.textContent = text(f.key);
    c.lowest.textContent = text('F');
  }
  if (c.sum) {
    const warning = values && Save.sumWarning(values);
    c.sum.hidden = !values;
    c.sum.className = warning ? 'warn' : 'muted';
    c.sum.textContent = warning ? '⚠ ' + warning : 'Weights sum to 1';
  }
  const changed = formChanged(part);
  c.preview.replaceChildren(...(values && changed ? previewLines(part, values) : []));
  c.reset.disabled = locked() || !changed;
  c.save.disabled = locked() || !changed || problems.size > 0;
  c.save.textContent = state.saving && c.working ? c.working : part === 'weights' ? 'Save weights' : 'Save boundaries';
  refreshDistribution();
}

// `With these weights {n} grades change.` (▸ lists `{id} {name}: B → B+`) or `No grade changes.`
function previewLines(part, values) {
  const changes = gradeChanges(part, values);
  if (!changes.length) return [el('p', { class: 'muted' }, 'No grade changes.')];
  const text = 'With these ' + (part === 'weights' ? 'weights ' : 'boundaries ') +
    (changes.length === 1 ? '1 grade changes.' : changes.length + ' grades change.');
  return [el('details', {}, el('summary', {}, text), el('ul', { class: 'cell-lines' }, ...changes.map((ch) =>
    el('li', {}, el('span', { class: 'id' }, ch.row.student_id), ' ', data('span', {}, ch.row.name),
      ': ', el('span', { class: gradeCls(ch.from) }, ch.from), ' → ', el('span', { class: gradeCls(ch.to) }, ch.to)))))];
}

function doSaveConfig(part) {
  const weights = part === 'weights';
  cfg[part].working = weights ? 'Saving weights…' : 'Saving boundaries…';
  cm.alert.replaceChildren();
  saveConfig(part).then((reply) => {
    renderView();
    if (reply.ok) {
      if (!weights) return say('Boundaries saved. Grades updated.');
      return say(reply.warning ? 'Weights saved (they sum to ' + Save.weightTotal(reply.course.weights) +
        '). Totals and grades updated.' : 'Weights saved. Totals and grades updated.');
    }
    if (reply.code === 'STALE_CONFIG') return configStale(part, reply.current);
    if (reply.code === 'INVALID') return configRefused(part, reply);
    if (reply.code === 'BUSY') {
      return alertBox('Another save is running; try again.', button('Retry', () => doSaveConfig(part), 'btn outline'));
    }
    alertBox('Not saved: ' + reply.message);
  }, (err) => {
    renderView();
    alertBox(failureKind(err) === 'offline' ? "You're offline. Connect, then try again."
      : "Google didn't answer. Try again in a moment.", button('Retry', () => doSaveConfig(part), 'btn outline'));
  });
  for (const p of CONFIG_PARTS) refreshConfig(p);
  refreshChrome();
}

// Another device saved this part after the page loaded (S10.5): nothing was written; the teacher picks.
function configStale(part, current) {
  const keys = part === 'weights' ? state.open.course.category_order.filter((k) => k in current)
    : Grades.gradeOrder(current);
  const done = (apply) => () => {
    cm.alert.replaceChildren();
    apply();
    renderView();
  };
  alertBox(el('span', {}, (part === 'weights' ? 'Weights' : 'Boundaries') +
    ' were changed on another device after you opened them. Nothing was saved.', el('br'),
    'On Drive now: ' + keys.map((k) => k + ' ' + current[k]).join(', ')),
  button('Use Drive values', done(() => { useConfig(part, current); delete state.forms[part]; }), 'btn outline'),
  button('Keep mine', done(() => keepForm(part, current)), 'btn outline'));
}

// INVALID from the server: the field's message, as the live check words it.
function configRefused(part, reply) {
  const f = cfg[part].fields.find((x) => x.key === reply.field);
  if (!f || reply.reason === 'keys') return alertBox('Not saved: ' + reply.message);
  f.msg.textContent = configMessage(reply, configForm(part));
  f.input.focus();
}

// ---- More sheet ----
function openMore() {
  const j = state.open.journal;
  const n = state.edits.size;
  const item = (label, sub, onclick, disabled) => {
    const b = el('button', { type: 'button', class: 'menu-item', onclick }, el('span', {}, label),
      sub ? el('span', { class: 'muted' }, sub) : null);
    b.disabled = disabled;
    return b;
  };
  const undoSub = n ? 'Save or discard your ' + F.plural(n, 'unsaved edit') + ' first'
    : j.undo ? F.fmtTime(j.undo.ts, state.now) + ' · ' + F.plural(j.undo.cells, 'cell')
      : String(j.undo_note).replace(/`/g, '');
  const title = j.unpulled
    ? el('span', {}, 'Drive: ' + F.plural(j.unpulled, 'edit') + ' not pulled', el('br'),
      el('span', { class: 'muted' }, 'last saved ' + F.fmtTime(j.last_saved, state.now)))
    : 'Drive: no edits waiting to be pulled';
  const d = dialog(title,
    item('Undo last save', undoSub, () => { d.close(); openUndo(); }, !!n || !j.undo || locked()),
    item(n ? 'Discard all unsaved edits (' + n + ')' : 'Discard all unsaved edits', n ? null : 'No unsaved edits',
      () => { d.close(); openDiscard(); }, !n || locked()),
    item('Reload from Drive', null, () => { d.close(); reload(); }, locked()),
    item('Switch course', null, () => { d.close(); leave(showCourses); }, state.saving),
    el('div', { class: 'sheet-actions' }, autofocused(button('Close', () => d.close(), 'btn outline'))));
}

// Reload from Drive: unsaved edits stay on top (they are conflict-checked on Save).
function reload() {
  const n = state.edits.size;
  reloadCourse().then((reply) => {
    if (!reply.ok) {
      return alertBox(reply.code === 'BUSY' ? 'Drive is busy with a save from another device. Try again in a moment.'
        : reply.message, button('Back to courses', backToCourses, 'btn outline'));
    }
    show(...courseView(null));
    renderView();
    say(n ? 'Reloaded. Your ' + F.plural(n, 'unsaved edit') + (n === 1 ? ' is' : ' are') + ' kept.' : 'Reloaded');
  }, (err) => {
    alertBox(failureKind(err) === 'offline' ? "You're offline. Connect, then try again."
      : "Google didn't answer. Try again in a moment.");
  });
}

// Search filters the rows only; unsaved edits and the column stay (S3.8, edge 46).
function applySearch() {
  cm.clear.hidden = state.search === '';
  if (state.view === 'table') {
    if (tb) searchTable();
    return;
  }
  if (state.view === 'summary') return searchSummary();
  if (state.view === 'analytics' || state.view === 'grading') return;
  let shown = 0;
  for (const it of cm.items) {
    it.li.hidden = !matches(it.row, state.search);
    if (!it.li.hidden) shown += 1;
  }
  if (state.view === 'attendance' && !sessions().length) {
    cm.empty.replaceChildren(el('p', {}, 'This course has no attendance sessions. Add them on the Mac, then push again.'));
  } else if (state.view === 'attendance' && !currentColumn()) {
    cm.empty.replaceChildren(el('p', {}, 'No session is dated today (' + longDate(today()) + '). Pick one above.'));
  } else if (!viewColumns().length) {
    cm.empty.replaceChildren(data('p', {}, 'No columns pushed for ' + state.category + '.'));
  } else if (!currentColumn()) {
    cm.empty.replaceChildren(el('p', {}, 'Pick a column to enter scores.'));
  } else if (shown === 0) {
    cm.empty.replaceChildren(data('p', {}, 'No students match "' + state.search.trim() + '".'),
      button('Clear search', clearSearch, 'btn outline'));
  } else {
    cm.empty.replaceChildren();
  }
}

function clearSearch() {
  state.search = '';
  cm.search.value = '';
  applySearch();
  cm.search.focus();
}

// ---- 14. grade-tui's tabs: the ☰ Categories menu, Summary Scores and Overview (SPEC_web_tabs.md) ----

// The current tab's menu: [1] Summary Scores, [2] All columns (wide) and the categories with their points,
// [3] Overview, [4] none.
function menuEntries() {
  if (state.tab === 'summary') return [{ key: 'summary', label: 'Summary Scores' }];
  if (state.tab === 'analytics') return [{ key: 'overview', label: 'Overview' }];
  if (state.tab !== 'raw') return [];
  const cats = Grades.navCategories(state.open.course).map((cat) => ({ key: cat, label: cat, pts: catPoints(cat) }));
  return (WIDE.matches ? [{ key: '*', label: 'All columns' }] : []).concat(cats);
}

// grade-tui's `[20 pts]`: the category's column maxima (a session counts 1), or its weight × 100 without columns.
function catPoints(cat) {
  const course = state.open.course;
  const cols = Grades.columnsOf(course, cat);
  if (!cols.length) return Grades.round2((course.weights[cat] || 0) * 100);
  return Grades.round2(cols.reduce((t, c) => t + (cat === 'attendance' ? 1 : maxOf(c.name)), 0));
}

function renderMenu() {
  const items = menuEntries();
  const current = state.tab === 'raw' ? state.category : items.length ? items[0].key : null;
  cm.menuList.replaceChildren(...items.map((m) => {
    const b = el('button', { type: 'button', class: 'cat-item', onclick: () => pickMenu(m.key) },
      data('span', {}, m.label), m.pts == null ? null : el('span', { class: 'muted' }, m.pts + ' pts'));
    if (m.key === current) b.setAttribute('aria-current', 'page');
    return el('li', {}, b);
  }));
  const open = state.menu && items.length > 0;
  cm.menuBtn.disabled = !items.length;
  cm.menuBtn.setAttribute('aria-expanded', String(open));
  cm.menu.hidden = !open;
  cm.scrim.hidden = !open || WIDE.matches;
  document.body.classList.toggle('menu-open', open);
}

// ☰: a side column on wide screens (remembered on this device), a drawer on phones (focus goes into it).
function toggleMenu() {
  state.menu = !state.menu;
  if (WIDE.matches) rememberMenu(state.menu);
  renderMenu();
  if (state.menu && !WIDE.matches) {
    const b = cm.menu.querySelector('[aria-current]') || cm.menu.querySelector('button');
    if (b) b.focus();
  }
}

function closeDrawer() {
  if (WIDE.matches || !state.menu) return;
  state.menu = false;
  renderMenu();
  cm.menuBtn.focus();
}

function pickMenu(key) {
  if (state.tab === 'raw' && key !== state.category) setCategory(key);
  closeDrawer();
}

// Summary Scores: the weighted categories as `{category} /{points}`, then Coursework Total, Final Score, Grade.
let sm = null;  // the shown Summary: student_id -> {node, paint} for live updates and search

function summaryFields(g) {
  const course = state.open.course;
  return course.category_order.filter((c) => Object.prototype.hasOwnProperty.call(course.weights, c))
    .map((cat) => [cat + ' /' + Grades.round2(course.weights[cat] * 100), g ? g.pct[cat] : null])
    .concat([['Coursework Total', g ? g.coursework_total || 0 : null], ['Final Score', g ? g.final_score : null]]);
}

const gradeSpan = (grade) => el('span', { class: 'grade-text ' + gradeCls(grade) }, grade);

// Wide: a read-only table (a name opens the detail). Phone: one line per student that unfolds the full row.
function renderSummary() {
  sm = new Map();
  if (WIDE.matches) {
    const heads = ['Student ID', 'Name'].concat(summaryFields(null).map((f) => f[0]), 'Grade');
    const cls = (i) => (i === 0 ? 'c-id' : i === 1 ? 'c-name' : 'c-calc');
    const head = el('tr', {}, ...heads.map((h, i) => el('th', { scope: 'col', class: cls(i) }, data('span', {}, h))));
    const body = el('tbody', {}, ...state.rows.map(summaryRow));
    cm.wrap.replaceChildren(el('table', { class: 'tb sum-table', 'aria-label': 'Summary Scores' },
      el('thead', {}, head), body));
  } else {
    cm.summary.replaceChildren(el('ul', { class: 'rows sum-list', 'aria-label': 'Summary Scores' },
      ...state.rows.map(summaryItem)));
  }
  searchSummary();
}

function summaryRow(row) {
  const cells = summaryFields(null).map(() => el('td', { class: 'c-calc' })).concat(el('td', { class: 'c-grade' }));
  const tr = el('tr', {}, el('td', { class: 'c-id' }, row.student_id),
    el('td', { class: 'c-name' }, el('button', { type: 'button', class: 'link', onclick: () => openDetail(row) },
      data('span', {}, row.name))), ...cells);
  const paint = () => {
    const g = gradeOf(row);
    summaryFields(g).forEach((f, i) => { cells[i].textContent = f[1]; });
    cells[cells.length - 1].replaceChildren(gradeSpan(g.grade));
  };
  sm.set(row.student_id, { node: tr, row, paint });
  paint();
  return tr;
}

function summaryItem(row, i) {
  const id = 'sum-' + i;
  const final = el('span', { class: 'sum-final' });
  const grade = el('span', { class: 'sum-grade' });
  const chevron = el('span', { class: 'chevron', 'aria-hidden': 'true' }, '▸');
  const fields = el('dl', { class: 'sum-fields' });
  const region = el('div', { id, class: 'sum-more', hidden: '' }, fields,
    button('Details ›', () => openDetail(row), 'btn outline'));
  const toggle = el('button', { type: 'button', class: 'sum-row', 'aria-expanded': 'false', 'aria-controls': id },
    el('span', { class: 'who' }, el('span', { class: 'id' }, row.student_id),
      data('span', { class: 'name' }, row.name)),
    final, grade, chevron);
  toggle.addEventListener('click', () => {
    region.hidden = !region.hidden;
    toggle.setAttribute('aria-expanded', String(!region.hidden));
    chevron.textContent = region.hidden ? '▸' : '▾';
  });
  const li = el('li', { class: 'sum-item' }, toggle, region);
  const paint = () => {
    const g = gradeOf(row);
    final.textContent = g.final_score;
    grade.replaceChildren(gradeSpan(g.grade));
    fields.replaceChildren(...summaryFields(g).concat([['Grade', gradeSpan(g.grade)]])
      .flatMap(([k, v]) => [el('dt', {}, k), el('dd', {}, v)]));
  };
  sm.set(row.student_id, { node: li, row, paint });
  paint();
  return li;
}

function paintSummary(row) {
  const r = sm && sm.get(row.student_id);
  if (r) r.paint();
}

function searchSummary() {
  if (!sm) return;
  for (const r of sm.values()) r.node.hidden = !matches(r.row, state.search);
}

// Analytics › Overview: grade-tui's four panels over the grades shown (unsaved edits included).
function renderOverview() {
  const d = overviewData();
  const ov = d.overview;
  const n = ov.total_count;
  const panel = (title, ...body) => el('section', { class: 'ov-panel' }, el('h2', {}, title), ...body);
  if (!n) {
    cm.overview.replaceChildren(panel('Overview', el('p', { class: 'muted' }, 'No students yet.')));
    return;
  }
  const pts = (x) => x.toFixed(2) + ' pts';
  const stats = [['Total enrolled', n + (n === 1 ? ' student' : ' students')], ['Mean', pts(ov.mean)],
    ['Median', pts(ov.median)], ['Std. deviation', pts(ov.std_dev)],
    ['Pass rate', ov.pass_rate.toFixed(1) + '% (' + ov.passing_count + '/' + n + ' passing)']];
  cm.overview.replaceChildren(
    panel('Class statistics', el('dl', { class: 'ov-stats' }, ...stats.flatMap(([k, v]) => [el('dt', {}, k),
      el('dd', {}, v)]))),
    panel('Grade distribution', el('ul', { class: 'dist' }, ...barItems(d.distribution.map((r) => ({ label: r.letter,
      cls: gradeCls(r.letter), count: r.count, pct: r.pct }))))),
    panel('Final Score histogram', el('ul', { class: 'dist hist' }, ...barItems(d.histogram.map((b) => ({
      label: b.label, cls: '', count: b.count, pct: (b.count / n) * 100 }))))),
    panel('Final Score box plot', ...boxPlot(d.box_plot)));
}

function svg(tag, attrs, ...children) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  node.append(...children);
  return node;
}

// A 0–100 axis (wider when a score is above 100): whiskers, the Q1–Q3 box, the median, the mean (dashed) and the
// outliers. The drawing is decorative; the text lines under it carry every value.
function boxPlot(bp) {
  const top = Math.max(100, bp.max);
  const x = (v) => (v / top) * 100;
  const line = (cls, x1, x2, y1, y2) => svg('line', { class: cls, x1: x(x1), x2: x(x2), y1, y2,
    'vector-effect': 'non-scaling-stroke' });
  const pic = svg('svg', { class: 'bp', viewBox: '0 0 100 20', preserveAspectRatio: 'none', 'aria-hidden': 'true' },
    line('bp-line', bp.whisker_low, bp.whisker_high, 10, 10),
    line('bp-line', bp.whisker_low, bp.whisker_low, 5, 15), line('bp-line', bp.whisker_high, bp.whisker_high, 5, 15),
    svg('rect', { class: 'bp-box', x: x(bp.q1), y: 3, width: Math.max(x(bp.q3) - x(bp.q1), 0.2), height: 14,
      'vector-effect': 'non-scaling-stroke' }),
    line('bp-median', bp.median, bp.median, 3, 17), line('bp-mean', bp.mean, bp.mean, 1, 19),
    ...bp.outliers.map((o) => line('bp-out', o.final_score, o.final_score, 6, 14)));
  const ticks = el('div', { class: 'bp-axis', 'aria-hidden': 'true' },
    ...[0, 0.25, 0.5, 0.75, 1].map((f) => el('span', {}, String(Grades.round2(top * f)))));
  const outliers = bp.outliers.length ? bp.outliers.map((o) => o.name + ' (' + o.student_id + ') ' + o.final_score)
    .join(', ') : 'none';
  return [pic, ticks,
    el('p', {}, ['Min ' + bp.min, 'Q1 ' + bp.q1, 'Median ' + bp.median, 'Q3 ' + bp.q3, 'Max ' + bp.max,
      'Mean ' + bp.mean].join(' · ')),
    el('p', { class: 'muted' }, 'Whiskers ' + bp.whisker_low + '–' + bp.whisker_high + ' · ' + bp.skew_label),
    data('p', {}, 'Outliers: ' + outliers)];
}

// grade-tui's keys on wide screens: 1–4 switch tabs, s shows/hides the menu. Not while typing, in the editing
// grid (digits start an edit there) or with a dialog open.
document.addEventListener('keydown', (e) => {
  if (!cm || !cm.list.isConnected || !WIDE.matches || e.ctrlKey || e.metaKey || e.altKey || e.defaultPrevented) return;
  const t = e.target;
  if (t.closest && t.closest('input, select, textarea, [contenteditable], [role="grid"], dialog, .detail')) return;
  if (document.querySelector('dialog[open]')) return;
  if (e.key >= '1' && e.key <= '4') {
    e.preventDefault();
    setTab(Grades.TABS[+e.key - 1]);
  } else if (e.key === 's' || e.key === 'S') {
    e.preventDefault();
    toggleMenu();
  }
});

// Crossing 960 px: the table <-> column mode (S5.3), and the menu becomes a side column or a closed drawer.
WIDE.addEventListener('change', () => {
  if (!cm || !cm.list.isConnected) return;
  state.menu = WIDE.matches && menuPref();
  if (state.view !== modeOf() || state.tab === 'summary' ||
      (state.tab === 'raw' && (state.category === '*' || state.category === 'attendance'))) {
    renderView();
  } else {
    renderMenu();
    refreshChrome();
  }
});
// Esc closes the detail side panel (inputs, sheets and the picker handle their own Esc first).
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || e.defaultPrevented || !det || document.querySelector('dialog[open]')) return;
  if (e.target.tagName === 'INPUT') return;
  closeDetail();
});
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', placeBar);
  window.visualViewport.addEventListener('scroll', placeBar);
}
// Ctrl/Cmd+S opens the Save sheet; leaving the focused input commits it first.
document.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 's' || !state.open || !cm) return;
  e.preventDefault();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  openSaveSheet();
});
// `/` focuses Search anywhere in a course (Interface "Keyboard").
document.addEventListener('keydown', (e) => {
  if (e.key !== '/' || !cm || !cm.search.isConnected) return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  e.preventDefault();
  cm.search.focus();
});

showCourses();
</script>
